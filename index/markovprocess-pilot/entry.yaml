notes: 'Consumer pilot of Scott Armstrong''s MarkovProcess (scottnarmstrong/MarkovProcess), which supplies
  the Brownian motion, exit times and Dynkin''s formula; one helper lemma is adapted from it with his
  notice. Both reusable claims are judged by lake comparator (toolchain mechanism, Lean v4.35.0: con-ron,
  NanoDa and Lean''s kernel) through Mathlib-only Challenges named by judged_as in claims.yaml. The headline''s
  Challenge (Audit/Exit/Challenge.lean, exit_mean) is quantified over any law that is Brownian in Mathlib''s
  sense. The bridge claim''s Challenge (Audit/BrownianKernel/Challenge.lean, exists_unique_brownian_kernel)
  states that exactly one Markov kernel is Brownian at every starting point: a Mathlib-only statement
  cannot name the library''s kernel, so it is stronger than the claim, and the Solution uses the library''s
  brownianMotion as the witness.'
