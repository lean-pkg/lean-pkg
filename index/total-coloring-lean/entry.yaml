notes: 'An unfinished project, listed as the example of one. Goal: kernel-checked foundations for total
  coloring (toward the Total Coloring Conjecture) via an all-orders auxiliary edge-coloring theorem and
  an auxiliary-to-total transfer. Not proved at this pin: the Total Coloring Conjecture; any unconditional
  Delta plus two total coloring; Vizing''s theorem; existence of the required extensions or partitions
  (five conditional endpoints take them as hypotheses and are listed as experimental claims). Every reusable
  claim (the two headline theorems and six supporting results) carries comparator evidence: a Mathlib-only
  Challenge in Audit/, named by the claim''s judged_as in claims.yaml, checked against the library by
  the legacy comparator mechanism (Lean v4.32.0 is below Palomar''s toolchain floor, so this says nothing
  about Palomar); each of the six later Solutions also derives the library theorem back from its Challenge.'
