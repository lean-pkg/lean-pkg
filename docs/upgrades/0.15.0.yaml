# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.14.0. Same keys as 0.14.0.yaml; the human page is docs/upgrades/0.15.0.md.
schema: lean-pkg-upgrade-record/1
version: 0.15.0
changes:
  - pr: 264
    id: lts-stack-opt-in
    kind: format
    area: new, coverage check, doctor, verify, page, stacks
    summary: >-
      Stage 1 of proposal 0004 (the math LTS stack). New flag new --stack NAME|current|none pins lean-toolchain
      and the Mathlib require to a declared stack and writes stack: NAME into coverage.yaml. New default: new
      --kind paper takes the current stack (the newest declared stack whose window covers today; lts-2026.10,
      Lean v4.35.0 and Mathlib v4.35.0, where 0.14.0 wrote v4.35.0-rc2), --kind library keeps the newest pins.
      coverage.yaml (coverage/1, both kinds) accepts an optional stack key, its name's shape checked. doctor
      takes an optional NAME and, like verify, checks the package's committed lean-toolchain, the Mathlib
      commit of lake-manifest.json and the comparator receipt's tool digests against the declared stack,
      warning on a difference, a stack past its window or one this lean-pkg does not declare, never refusing;
      both gain the --json key stack. page adds "Built on lean-pkg stack NAME" under How this was checked
      when the pins match. The lakefile.toml of new names its library in defaultTargets, so a bare lake build
      builds it. The stacks ship in the wheel (lean_pkg/data/stacks/). No schema bump; lean-pkg 0.14.0 and
      older refuse the stack key.
    action: >-
      Nothing for an existing package. A package that opts in adds stack: lts-2026.10 to coverage.yaml (or is
      made with new --stack), requires this lean-pkg release or later (older ones refuse the key), and moves
      its pins as docs/stacks/lts-2026.10.md says; doctor NAME then reports whether the committed pins match.
      A new paper scaffold now starts on Lean v4.35.0 and Mathlib v4.35.0; pass --stack none for the previous
      pins. An existing scaffold's lakefile.toml can gain defaultTargets = ["MOD"] after its name line.
    breaking: false
    changelog: Added
  - pr: 267
    id: index-built-on-credits
    kind: format
    area: index add, index check, index render, index entries
    summary: >-
      Proposal 0007 (draft). index-entry/2 accepts an optional built_on key: credits for the third-party Lean
      code a package depends on or adapts (name, https url, authors; optional license, 40-hex pin, relation
      depends-on or adapted-from, note), validated strictly, never evidence. index render adds a Built on
      column and a Built on section to index/README.md. index add gains --built-on-file FILE and --replace
      (re-pin an existing entry, carrying its built_on over; without it an existing entry is still refused);
      index add --json gains replaced and built_on. index check validates the key and, with --clone or
      --repo-dir, warns when a depends-on pin differs from lake-manifest.json at the pin. No schema bump;
      lean-pkg 0.14.0 and older refuse the built_on key. markovprocess-pilot now credits MarkovProcess and
      gromov-filling-lean its four upstream libraries.
    action: >-
      Nothing for a package author. A maintainer re-pinning an index entry uses index add --replace, which
      keeps the entry's credits; to credit a library, pass --built-on-file (the format is in
      docs/index-catalog.md). A fork that checks this index with lean-pkg 0.14.0 or older must upgrade.
    breaking: false
    changelog: Added
  - pr: 269
    id: index-check-uncredited-dependencies
    kind: behavior
    area: index check
    summary: >-
      Proposal 0007 accepted (2026-10-18, after #267 had merged as its implementation). index check --clone
      (or --repo-dir) warns on each lake-manifest.json package at the entry's pin that is not Mathlib, one
      of Mathlib's own dependencies (a documented list of names and URLs, or an inherited package from the
      leanprover-community or leanprover GitHub organizations) or Lean core, and that no built_on credit
      names by URL (with or without .git) or by name. The exit status and ok are unchanged; --json gains
      the additive per-entry key uncredited_dependencies (name, url).
    action: >-
      Nothing for a package author. An index entry whose package requires a non-Mathlib Lake library adds
      a built_on credit for it (index add --replace --built-on-file); a script reading index check output
      may see the new warning notes.
    breaking: false
    changelog: Added
# Read for this record, nothing for a package author: index data, total-coloring-lean and
# markovprocess-pilot re-pinned at their new gated commits with judged_as on every reusable claim (#265);
# index data, total-coloring-lean re-pinned at its 0.2.0 release (#266); index data, Zenodo DOIs for
# markovprocess-pilot and total-coloring-lean (#268).
no_author_change: [265, 266, 268]
