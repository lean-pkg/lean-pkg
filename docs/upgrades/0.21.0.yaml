# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.20.0. Same keys as 0.20.0.yaml; the human page is docs/upgrades/0.21.0.md.
# The name 0.21.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.21.0
changes:
  - pr: 299
    id: claim-axioms-narrower-print
    kind: behavior
    area: receipts
    summary: >-
      The per-claim axiom check (receipt slurm, receipt systemd, gate, receipt check) no longer refuses a claim
      whose #print axioms output in the same log names fewer axioms than the environment walk. Under the Lean
      module system #print axioms on a structure type can print 'does not depend on any axioms' while the walk
      gives the standard axioms; the walk is the verdict, so this is now a check line naming both lists. A
      #print axioms output naming an axiom the walk did not find is still refused, as proposal 0005 states.
    action: >-
      Nothing for most package authors. A package using the module system whose receipt slurm or receipt
      systemd refused 'claim axioms: NAME: the environment gives [...], its #print axioms output in the same
      log none; the two disagree' reruns the same command on the same saved files with this release; no new
      verification job is needed.
    breaking: false
    changelog: Fixed
  - pr: 297
    id: producer-bytecode-fingerprint
    kind: format
    area: receipts
    summary: >-
      The receipt key producer (receipt systemd/local --run) gains bytecode_tag, bytecode_files,
      bytecode_sha256 and other_bytecode_files. sources_sha256 covers the sources only (it leaves out
      __pycache__/ and every .pyc), but Python executes a module from its cached
      __pycache__/<name>.<cache_tag>.pyc, so the key now also fingerprints, at the run start, the running
      interpreter's own caches (__pycache__/*.<tag>.pyc and *.<tag>.opt-N.pyc, hashed like the sources; null
      without a cache tag) and counts every other .pyc/.pyo in the package. Bytecode is never compared during
      a run. The - Producer: README line names the bytecode digest.
    action: >-
      Nothing for a package author: gate and receipt check ignore the key, and receipts written before keep
      validating. A pin or audit that cites sources_sha256 as the identity of the code that ran should also
      read bytecode_sha256 (and treat a nonzero other_bytecode_files as another interpreter's caches in the
      install).
    breaking: false
    changelog: Added
  - pr: 300
    id: receipt-producer-slurm-comparator
    kind: format
    area: receipts, receipt slurm, comparator receipts
    summary: >-
      receipt slurm and receipt comparator (alias comparator-receipt) now write the additive key producer, the
      lean-pkg that wrote the receipt, with the shape receipt systemd --run seals (lean_pkg, install, commit,
      dirty, sources_sha256, source_files, python, bytecode_tag, bytecode_files, bytecode_sha256,
      other_bytecode_files), built from the running lean-pkg when it writes the receipt (a field report: an
      evidence chain mixing lean-pkg versions was invisible). For receipt slurm that is the collector, not the
      lean-pkg inside the job, and it is always recorded (receipt systemd records it only with --run).
      receipt slurm --json gains producer. No path, host or user name is written.
    action: >-
      Nothing for a package author: gate, gate --check, receipt check and the comparator validator ignore the
      key, receipts written before keep validating, and an older lean-pkg reads a receipt with the key
      unchanged. A script that compares a receipt's exact key list sees one more key.
    breaking: false
    split: true
    changelog: Added
  - pr: 300
    id: producer-skew-status-doctor
    kind: command
    area: status, doctor
    summary: >-
      New flag doctor --package NAME, and a producer block in status NAME: for the package's gate receipts
      (gate.receipt and gate.comparator), the lean-pkg that wrote each (producer.lean_pkg, or unknown) against
      the running one. A WARN names the breaking upgrade-record entries in an evidence area (receipts, gate,
      claims and their components; producer_skew.EVIDENCE_AREAS) between an older producer and the running
      lean-pkg, with lean-pkg doctor --upgrade-from vPRODUCER --source DIR, and always flags a producer newer
      than the running lean-pkg; an older producer with no such entry, the same version or no producer is info
      only. Never a refusal or an exit 1. status --json gains producer_skew; doctor --json gains it with
      --package; doctor --package with --upgrade-from exits 2. The breaking entries ship in the package as
      src/lean_pkg/data/upgrade-breaking.yaml, generated from docs/upgrades/*.yaml by
      scripts/upgrade-breaking.py.
    action: >-
      Nothing required. Run lean-pkg status NAME (or doctor --package NAME) after moving to another lean-pkg;
      on a WARN, read the named entries with the printed doctor --upgrade-from command, and upgrade lean-pkg
      before trusting gate or receipt check on a receipt a newer lean-pkg wrote. A pull request adding a
      breaking record entry regenerates the data file (RELEASING.md, "The breaking-entries file").
    breaking: false
    split: true
    changelog: Added
# Read for this record, nothing for a package author: release tooling, one entry per pull request unless
# each of its entries is marked split: true; marks the multi-entry PRs of 0.11.0, 0.12.0 and 0.20.0 (#296).
# Tests only: the suite no longer depends on the host's pytest version or global git config (#298).
# Docs and messages: an example for every runnable command in the command reference, and index check and
# search --record name their local-clone flag --repo in messages, help and llms (--repo-dir still works) (#301).
# Messages and docs: register and update name their URL flag --url, as --help does (--repo still works) (#302).
# Collaborator setup script: register --url, or --repo for a lean-pkg older than 0.11.0 (#303); its
# checks written as if/then/else, so ShellCheck reports nothing (#304).
# ShellCheck disable comments for two intended findings in verify-comparator.sh and a test stub (#305).
# make shellcheck in make check, and a pinned ShellCheck step in CI (#306).
# Docs: canonical flag spellings in every example, and a test that keeps them canonical (#307); canonical
# command spellings too, and the test covers command aliases (#308).
# Tests: run in parallel with pytest-xdist in make test and CI; two tests no longer patch the
# process-wide time.sleep (#309).
no_author_change: [296, 298, 301, 302, 303, 304, 305, 306, 307, 308, 309]
