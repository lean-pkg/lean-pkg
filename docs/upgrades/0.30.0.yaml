# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.29.0. Same keys as 0.29.0.yaml; the human page is docs/upgrades/0.30.0.md.
# The name 0.30.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.30.0
changes:
  - pr: 449
    id: agent-env-default
    kind: behavior
    area: gate, cli
    summary: >-
      gate (not gate --check) and update take their --agent from $LEAN_PKG_AGENT when none is given; the
      value is checked against a live lease exactly as a typed --agent is, so it never gets past another
      agent's lease, and a typed --agent wins. Empty counts as unset. Listed in lean-pkg help environment.
    action: >-
      Nothing required. An agent that works under its own lease can export LEAN_PKG_AGENT=HOLDER instead of
      passing --agent HOLDER on every gate and update. A shell that already exports LEAN_PKG_AGENT for
      another purpose now gives gate and update an agent: unset it there if that is not wanted.
    breaking: false
    changelog: Added
  - pr: 450
    id: gate-next-claims-sync
    kind: behavior
    area: gate
    summary: >-
      The writing gate prints `next: lean-pkg claims sync NAME` (with the invocation's --agent) when a claims
      file is tracked at the gated commit and the registry's claims cache (claims_synced_commit) was read
      neither at that commit nor at HEAD; gate --json gains next_command, that command or null. Printed,
      never run; nothing else changes.
    action: >-
      Nothing required. Run the printed claims sync after a gate so that status and the claims ledger read
      the gated claims. A script that reads the last line of gate's text output now sees the next: line.
    breaking: false
    changelog: Added
  - pr: 452
    id: receipt-systemd-memory-warning
    kind: behavior
    area: receipt systemd, verify
    summary: >-
      receipt systemd (--run, and reading a finished unit) prints a warning, never a refusal, when the unit's
      MemoryPeak exceeds 80% of its MemoryMax, naming --memory-max and a cap of 1.5 times the peak rounded up
      to whole GiB; --json gains memory_warning (null otherwise); the receipt is unchanged. lean-pkg verify
      gains --memory-max BYTES, passed to its receipt systemd step.
    action: >-
      Nothing required. When the warning appears, re-run with --memory-max (receipt systemd --run, or lean-pkg
      verify) before the package grows past the cap.
    breaking: false
    changelog: Added
  - pr: 453
    id: declared-controls-section
    kind: format
    area: receipts, verify
    summary: >-
      Proposal 0014, first stage: a new optional file lean-pkg-controls.yaml (schema controls/1, a fixed
      line shape) declares must-fail, refutes and compiles controls. The verify scripts (receipt slurm
      --template, and the verify.sh lean-pkg new writes) run each control alone through lean-pkg's
      ControlsProbe.lean and append a controls/1 section to the sealed verify log (ctl-decl, one ctl line per
      control, ctl-done); report_sha256 covers it; the receipt schema does not change. lean-pkg verify's
      preflight refuses a declaration that fails the schema. The gate does not read the section yet.
    action: >-
      Nothing for a package without the file. To declare controls, commit lean-pkg-controls.yaml (check it
      with python3 -m lean_pkg.controls --file), and regenerate a package's verify.sh (or use the current
      receipt slurm template) so that the job runs them; an older verify script ignores the file.
    breaking: false
    changelog: Added
  - pr: 454
    id: type-driver-deep-terms
    kind: behavior
    area: comparator config
    summary: >-
      The type driver behind comparator config --challenge-from-type (and --emit-script) sets pp.deepTerms true
      and pp.maxSteps 10000000, so a statement nested deeper than Lean's default threshold (50) is printed whole
      instead of with an elided ⋯ that the round-trip check refused. Shallow statements print as before.
    action: >-
      Nothing required. A claim that was marked needs_restatement or failed the round trip only because of an
      elided ⋯ can be regenerated with --challenge-from-type.
    breaking: false
    changelog: Fixed
  - pr: 455
    id: coverage-r11-internal-claims
    kind: behavior
    area: coverage
    summary: >-
      coverage check's rule R11 (every compared theorem accounted for) also accepts a theorem that is the
      declaration of a claim claims.yaml marks internal or reusable, with no row naming it. A theorem of no
      claim still fails; one of an experimental or superseded claim fails with the claim and its status named.
      The offline form (--comparator) reads those claims' Lean files and skips the check when one is not
      readable. receipt check's coverage detail and the pass line of the offline check change wording.
    action: >-
      Nothing required. A package that added rows only to account for compared helper lemmas can mark those
      claims internal (lean-pkg claims mark NAME --from-comparator CONFIG --status internal) instead. A script
      matching the old R11 pass or error text should match the new wording.
    breaking: false
    changelog: Changed
# Docs: proposal 0014 (declared controls in the sealed verify log) added, accepted; nothing implemented
# (#451). Proposal 0015 (extension keys in coverage.yaml) added, accepted; nothing implemented (#456).
no_author_change: [451, 456]
