# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.29.0. Same keys as 0.29.0.yaml; the human page is docs/upgrades/0.30.0.md.
# The name 0.30.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.30.0
changes:
  - pr: 449
    id: agent-env-default
    kind: behavior
    area: gate, cli
    summary: >-
      gate (not gate --check) and update take their --agent from $LEAN_PKG_AGENT when none is given; the
      value is checked against a live lease exactly as a typed --agent is, so it never gets past another
      agent's lease, and a typed --agent wins. Empty counts as unset. Listed in lean-pkg help environment.
    action: >-
      Nothing required. An agent that works under its own lease can export LEAN_PKG_AGENT=HOLDER instead of
      passing --agent HOLDER on every gate and update. A shell that already exports LEAN_PKG_AGENT for
      another purpose now gives gate and update an agent: unset it there if that is not wanted.
    breaking: false
    changelog: Added
  - pr: 450
    id: gate-next-claims-sync
    kind: behavior
    area: gate
    summary: >-
      The writing gate prints `next: lean-pkg claims sync NAME` (with the invocation's --agent) when a claims
      file is tracked at the gated commit and the registry's claims cache (claims_synced_commit) was read
      neither at that commit nor at HEAD; gate --json gains next_command, that command or null. Printed,
      never run; nothing else changes.
    action: >-
      Nothing required. Run the printed claims sync after a gate so that status and the claims ledger read
      the gated claims. A script that reads the last line of gate's text output now sees the next: line.
    breaking: false
    changelog: Added
  - pr: 452
    id: receipt-systemd-memory-warning
    kind: behavior
    area: receipt systemd, verify
    summary: >-
      receipt systemd (--run, and reading a finished unit) prints a warning, never a refusal, when the unit's
      MemoryPeak exceeds 80% of its MemoryMax, naming --memory-max and a cap of 1.5 times the peak rounded up
      to whole GiB; --json gains memory_warning (null otherwise); the receipt is unchanged. lean-pkg verify
      gains --memory-max BYTES, passed to its receipt systemd step.
    action: >-
      Nothing required. When the warning appears, re-run with --memory-max (receipt systemd --run, or lean-pkg
      verify) before the package grows past the cap.
    breaking: false
    changelog: Added
no_author_change: []
