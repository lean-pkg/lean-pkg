# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.21.0. Same keys as 0.21.0.yaml; the human page is docs/upgrades/0.22.0.md.
# The name 0.22.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.22.0
changes:
  - pr: 322
    id: commit-flags-on-write-commands
    kind: command
    area: cli
    summary: >-
      --commit, --push and --no-commit appear in the help of the commands that can write the registry (and of
      verify, which passes them on) only. A read-only command (list, next, status, public-safety, claims check,
      ...) still accepts them after its name, as before, and notes '--commit ignored: read-only command' on
      stderr; the split is derived from the predicate behind committed mode (is_write_invocation). The command
      reference shows [common flags] only on those commands, and no longer on new, receipt slurm, receipt
      systemd and receipt check, which never accepted the commit flags.
      doctor --upgrade-from does not list the hidden flags as removed options.
    action: >-
      Nothing: every invocation parses and behaves as before; only --help texts change.
    breaking: false
    changelog: Changed
    split: true
  - pr: 322
    id: repo-for-the-checkout
    kind: command
    area: cli, comparator receipts
    summary: >-
      The package checkout is --repo DIR on every command: lean-pkg receipt comparator and the comparator-receipt
      program, python3 -m lean_pkg.claim_axioms and python3 -m lean_pkg.dup_constants said --project. --project
      stays a permanent alias (the same value, output and exit code), with a stderr note in text mode
      (LEAN_PKG_NO_ALIAS_NOTE=1 silences it); lean-pkg help aliases lists them. The commands lean-pkg prints
      (verify's comparator step, next, repo export) now say --repo. lean-exercise --project, a prebuilt Mathlib
      project rather than the package checkout, is unchanged.
    action: >-
      Nothing required. Scripts may keep --project; write --repo in new ones to drop the note.
    breaking: false
    changelog: Changed
    split: true
  - pr: 324
    id: lower-receipt-schema-marker
    kind: format
    area: receipts, receipt slurm, gate, receipt check
    summary: >-
      receipt slurm and receipt systemd (alias receipt local) write "schema": "lower-receipt/1" as the first key
      of every lower-tier receipt (the 1.0 command tree, section 6, item 1). A receipt without the key (every
      receipt written before) is version 0 and is judged exactly as before, forever, by gate, gate --check,
      receipt check and every other reader of a recorded receipt. A receipt naming a newer lower-receipt/N is
      refused ('lower-tier receipt schema lower-receipt/N is not supported ...; this lean-pkg is older than
      the receipt: upgrade lean-pkg', exit 1), and any other schema value is refused as malformed.
    action: >-
      Nothing for a package author: receipts already committed keep validating and are never rewritten. A
      script that compares a receipt's exact key list sees one more key, first. A receipt written by this
      release is refused by a later lean-pkg only if that lean-pkg drops lower-receipt/1, which the format
      policy rules out (docs/formats.md).
    breaking: false
    changelog: Added
    split: true
  - pr: 324
    id: event-line-version
    kind: format
    area: registry
    summary: >-
      Every line lean-pkg appends to lean-package-events.jsonl carries v: 1 (section 6, item 2); a line
      without v is version 0 and is read as before. The prior-art note of lease claim, the one reader that
      interprets events, skips a line with a newer or unreadable v and prints a warning naming the upgrade.
      Every event name and its keys are documented in docs/formats.md ("Event log") and lean-pkg llms, from
      EVENT_KEYS in the code, which the test suite checks against every emitting call. history[] entries in
      the registry are unchanged (no v).
    action: >-
      Nothing for a package author. A tool that reads the event log sees one more key on new lines; it can
      treat a line without v as version 0. Old lines are never rewritten.
    breaking: false
    changelog: Added
    split: true
  - pr: 334
    id: new-root-module-glob
    kind: behavior
    area: new
    summary: >-
      lean-pkg new writes globs = ["MOD", "MOD.+"] in lakefile.toml (#326), as published lean-pkg packages do,
      and an empty root module MOD.lean for the library's imports, so a bare lake build still passes. With
      MOD.+ alone Lake never built MOD.lean, and a Solution importing the library through it failed with
      'object file ... MOD.olean of module MOD does not exist'. The getting-started template changes with it.
    action: >-
      Nothing for a new scaffold. A package scaffolded before, whose Solution imports a root module MOD.lean,
      adds "MOD" to the globs of its lean_lib.
    breaking: false
    changelog: Fixed
    split: true
  - pr: 334
    id: new-stable-pins
    kind: behavior
    area: new
    summary: >-
      Without --stack, lean-pkg new pins the newest stable Lean release in the table it ships, with the
      matching Mathlib tag, and a release candidate only when no stable release is newer (#327): the pins are
      leanprover/lean4:v4.35.0 and Mathlib v4.35.0, where they were v4.35.0-rc2. No network is read, as
      before. The output says when the pins are a release candidate, and --json adds release_candidate.
    action: >-
      Nothing. A package scaffolded on v4.35.0-rc2 may move to v4.35.0 (lean-toolchain, the Mathlib rev, then
      lake update); a script reading new --json sees one more key.
    breaking: false
    changelog: Fixed
    split: true
  - pr: 335
    id: coverage-check-offline
    kind: command
    area: coverage check
    summary: >-
      lean-pkg coverage check --file coverage.yaml [--claims claims.yaml] [--comparator comparator.json ...],
      without NAME, is an offline check (#328): no registry record and no receipt are read. It runs the coverage/1
      schema and its length limits, the manuscript version, lean_pkg_version, the claims file's claims/1 schema,
      each row's claim ids, a warning per reusable claim no row names, and each comparator theorem the
      declaration of a claim a row names, and lists as skipped the checks that need the registry, the checkout
      at HEAD or a receipt. With NAME the command is unchanged; --claims and --comparator with NAME exit 2.
    action: >-
      Nothing required. Validate coverage.yaml with the offline form before the commit you will gate.
    breaking: false
    changelog: Added
    split: true
  - pr: 335
    id: verify-preflight
    kind: behavior
    area: verify
    summary: >-
      lean-pkg verify NAME runs a preflight as step 0, before any receipt work (#325): the claims/1 check of
      claims check --file on the claims file committed at HEAD and, when coverage.yaml is committed, the offline
      coverage check against the files and comparator configurations committed at HEAD. A refusal stops verify
      with that message, nothing run and nothing written. Placeholder text and an unposted manuscript are
      warnings there. It runs under --dry-run too; --json steps[] begins with a '0/3 preflight' entry.
    action: >-
      Nothing for a package whose committed claims.yaml and coverage.yaml are valid. One that is not now stops
      verify before the receipts instead of at the gate or the page: fix the file in a new commit and run verify
      again. A script that indexes verify's --json steps[] by position sees one more entry, first.
    breaking: false
    changelog: Changed
    split: true
  - pr: 336
    id: report-redaction-of-attached-sections
    kind: behavior
    area: report
    summary: >-
      report no longer refuses every report when the registry has a live lease (#330). The blocking guard
      scanned the whole body, the report's own fixed prose included, where a registry-derived name that is also
      a word (home, from a workspace under /home/...) matched; it now scans the user's text (title, --command,
      --body, --from-log, --package) and each section report attaches itself, line by line, and a refusal names
      the section in text and in --json (additive sections[] {section, origin user|attached, families}). A
      private name in the user's own text is still redacted to […], not refused. In the attached sections every
      record's and lease's agent, workspace and contact value becomes <agent>, <workspace>, <contact>, and the
      local paths doctor and the version line name become whole placeholders instead of a partly redacted path:
      <lean-pkg-install>, <lean-pkg-checkout> (editable install), <python>, <registry-repo>, <index-dir>,
      <events-path> (an event log that is not the registry's sibling).
    action: >-
      Nothing. A script that matched […] or ~/... for an agent, a workspace or one of those paths in a report
      body sees the placeholder.
    breaking: false
    changelog: Fixed
  - pr: 338
    id: ci-receipt-github-actions-level-1
    kind: format
    area: receipts, gate, receipt check, coverage check, page
    summary: >-
      Stage S1 of proposal 0008 (#318): a built-in-only scheduler github-actions (job id
      gha-<run_id>-<run_attempt>) and built-in site profile of the same name, and an additive ci block of
      lower-receipt/1 naming the GitHub Actions run (docs/formats.md, "The ci block"). gate, gate --check,
      receipt check and every reader of a recorded receipt refuse a ci block that fails any level-1 rule, each
      named; unknown keys inside it are ignored, and a receipt without it is judged as before. A receipt whose
      block passes backs coverage.yaml compute [{cluster: github-actions, jobs: [gha-R-A]}]; a gha- receipt
      without the block still gates and backs nothing. Level 1 is offline consistency, as forgeable as
      slurm-<J>: the page never carries the GitHub Actions sentence at level 1, and a README carrying it fails
      page --check and the publish --dry-run page line. page --json gains level, levels and sentence per site
      under sites; the legacy top-level key stays easley only, in its old shape. Newly refused: a package
      profile lean-pkg-sites/github-actions.yaml (a built-in name), a package profile with scheduler
      github-actions, and an acknowledgement containing {runs} outside a built-in level-2 profile.
    action: >-
      Nothing for a package on Slurm or receipt local: its receipts, profiles and page are unchanged. The
      compute[].cluster error now lists github-actions among the accepted names. A script reading page --json
      sites sees three more keys per site. No package in the public index commits a profile that is now
      refused.
    breaking: false
    changelog: Added
  - pr: 0
    id: repo-export-explicit-identity
    kind: behavior
    area: repo export
    summary: >-
      repo export sets the author and committer of the export commit explicitly (#339): --author 'NAME <EMAIL>',
      else user.name and user.email of the source repository's local git config (git config --local); the global
      identity, which put a personal address into public history, is never used. With neither the export refuses
      ('no identity for the export commit: pass --author ...', exit 1, nothing written), and an address that is not
      a GitHub noreply one (ID+LOGIN@users.noreply.github.com or LOGIN@users.noreply.github.com) refuses unless
      --allow-author-email is given; --dry-run refuses the same way. The export's own public-safety scan checks
      that identity and the commit message (with --from-tree or not), so a private pattern in either refuses
      whatever the flags.
    action: >-
      Before repo export, set a noreply identity in the source repository (git -C SRC config user.name NAME; git
      -C SRC config user.email ID+LOGIN@users.noreply.github.com) or pass --author 'NAME
      <ID+LOGIN@users.noreply.github.com>'. To publish another address on purpose, add --allow-author-email.
    breaking: true
    changelog: Fixed
    split: true
  - pr: 0
    id: repo-export-author-flags
    kind: command
    area: repo export, publish
    summary: >-
      New flags repo export --author 'NAME <EMAIL>' (author and committer of the export commit) and
      --allow-author-email (accept an address that is not a GitHub noreply one) (#339). repo export --json gains
      identity {author, committer, source, noreply} and the plan a 'commit identity:' line. publish --dry-run gains
      the checklist line 'commit identities going public: ...', the distinct author and committer addresses of
      every ref the flip publishes: a pass when each is a GitHub noreply address, else a warning naming the others,
      never a failure.
    action: >-
      Nothing required. Read the new publish line before the flip; a script reading publish --json checklist[]
      sees one more entry.
    breaking: false
    changelog: Added
    split: true
  - pr: 0
    id: repo-export-carry-used-allow-lines
    kind: behavior
    area: repo export
    summary: >-
      repo export carries into the committed .lean-pkg-public-allow only the allow: lines of
      .lean-pkg-private-patterns that its own scan used (they exempted something in the staged tree, the commit
      message or the identity) (#340); it carried every allow line, and an unused one, whose pattern names what it
      allows, leaked into the public repository and allowed nothing. Unused lines are dropped and counted, never
      printed (JSON public_allow gains unused and present); with none used no .lean-pkg-public-allow is written.
      Only a carried line holding a private string refuses the export now.
    action: >-
      Nothing. If a later commit of the exported repository needs an allow line that was dropped, add it to
      .lean-pkg-public-allow by hand (it is public).
    breaking: false
    changelog: Fixed
    split: true
