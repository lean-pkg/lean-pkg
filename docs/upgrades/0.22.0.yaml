# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.21.0. Same keys as 0.21.0.yaml; the human page is docs/upgrades/0.22.0.md.
# The name 0.22.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.22.0
changes:
  - pr: 322
    id: commit-flags-on-write-commands
    kind: command
    area: cli
    summary: >-
      --commit, --push and --no-commit appear in the help of the commands that can write the registry (and of
      verify, which passes them on) only. A read-only command (list, next, status, public-safety, claims check,
      ...) still accepts them after its name, as before, and notes '--commit ignored: read-only command' on
      stderr; the split is derived from the predicate behind committed mode (is_write_invocation). The command
      reference shows [common flags] only on those commands, and no longer on new, receipt slurm, receipt
      systemd and receipt check, which never accepted the commit flags.
      doctor --upgrade-from does not list the hidden flags as removed options.
    action: >-
      Nothing: every invocation parses and behaves as before; only --help texts change.
    breaking: false
    changelog: Changed
    split: true
  - pr: 322
    id: repo-for-the-checkout
    kind: command
    area: cli, comparator receipts
    summary: >-
      The package checkout is --repo DIR on every command: lean-pkg receipt comparator and the comparator-receipt
      program, python3 -m lean_pkg.claim_axioms and python3 -m lean_pkg.dup_constants said --project. --project
      stays a permanent alias (the same value, output and exit code), with a stderr note in text mode
      (LEAN_PKG_NO_ALIAS_NOTE=1 silences it); lean-pkg help aliases lists them. The commands lean-pkg prints
      (verify's comparator step, next, repo export) now say --repo. lean-exercise --project, a prebuilt Mathlib
      project rather than the package checkout, is unchanged.
    action: >-
      Nothing required. Scripts may keep --project; write --repo in new ones to drop the note.
    breaking: false
    changelog: Changed
    split: true
  - pr: 324
    id: lower-receipt-schema-marker
    kind: format
    area: receipts, receipt slurm, gate, receipt check
    summary: >-
      receipt slurm and receipt systemd (alias receipt local) write "schema": "lower-receipt/1" as the first key
      of every lower-tier receipt (the 1.0 command tree, section 6, item 1). A receipt without the key (every
      receipt written before) is version 0 and is judged exactly as before, forever, by gate, gate --check,
      receipt check and every other reader of a recorded receipt. A receipt naming a newer lower-receipt/N is
      refused ('lower-tier receipt schema lower-receipt/N is not supported ...; this lean-pkg is older than
      the receipt: upgrade lean-pkg', exit 1), and any other schema value is refused as malformed.
    action: >-
      Nothing for a package author: receipts already committed keep validating and are never rewritten. A
      script that compares a receipt's exact key list sees one more key, first. A receipt written by this
      release is refused by a later lean-pkg only if that lean-pkg drops lower-receipt/1, which the format
      policy rules out (docs/formats.md).
    breaking: false
    changelog: Added
    split: true
  - pr: 324
    id: event-line-version
    kind: format
    area: registry
    summary: >-
      Every line lean-pkg appends to lean-package-events.jsonl carries v: 1 (section 6, item 2); a line
      without v is version 0 and is read as before. The prior-art note of lease claim, the one reader that
      interprets events, skips a line with a newer or unreadable v and prints a warning naming the upgrade.
      Every event name and its keys are documented in docs/formats.md ("Event log") and lean-pkg llms, from
      EVENT_KEYS in the code, which the test suite checks against every emitting call. history[] entries in
      the registry are unchanged (no v).
    action: >-
      Nothing for a package author. A tool that reads the event log sees one more key on new lines; it can
      treat a line without v as version 0. Old lines are never rewritten.
    breaking: false
    changelog: Added
    split: true
