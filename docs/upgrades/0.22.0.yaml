    summary: >-
      receipt slurm and receipt systemd (alias receipt local) write "schema": "lower-receipt/1" as the first key
      of every lower-tier receipt (the 1.0 command tree, section 6, item 1). A receipt without the key (every
      receipt written before) is version 0 and is judged exactly as before, forever, by gate, gate --check,
      receipt check and every other reader of a recorded receipt. A receipt naming a newer lower-receipt/N is
      refused ('lower-tier receipt schema lower-receipt/N is not supported ...; this lean-pkg is older than
      the receipt: upgrade lean-pkg', exit 1), and any other schema value is refused as malformed.
    action: >-
      Nothing for a package author: receipts already committed keep validating and are never rewritten. A
      script that compares a receipt's exact key list sees one more key, first. A receipt written by this
      release is refused by a later lean-pkg only if that lean-pkg drops lower-receipt/1, which the format
      policy rules out (docs/formats.md).
    breaking: false
    changelog: Added
    split: true
