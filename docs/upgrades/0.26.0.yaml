# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.25.0. Same keys as 0.25.0.yaml; the human page is docs/upgrades/0.26.0.md.
# The name 0.26.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.26.0
changes:
  - pr: 418
    id: types-namespace-relative-decl
    kind: behavior
    area: comparator config
    summary: >-
      comparator config --from-claims --challenge-from-type / --emit-script resolves a claim decl written
      relative to its namespace (decl: baz inside namespace Demo) to the full constant name read from the
      claim's file at HEAD, so Lean finds its type; the scaffold entry and the driver result carry it as
      `name`, keyed by the unchanged `decl`. Before, every such claim was "unknown constant" and stayed TODO.
    action: >-
      Nothing. Re-run --challenge-from-type (or the emitted driver) for claims that stayed TODO with an
      unknown constant. To have those claims credited as covered, write their full names in claims.yaml.
    breaking: false
    changelog: Fixed
  - pr: 421
    id: install-from-pypi
    kind: behavior
    area: install
    summary: >-
      lean-pkg is on PyPI from 0.25.0, and the install docs (README, quickstart, getting-started, the agent
      contract) say `pipx install lean-pkg`. Installing from the Git URL still works and gives unreleased code.
    action: >-
      Nothing. A pipx install made from the Git URL keeps upgrading from Git; to follow PyPI releases instead,
      run `pipx uninstall lean-pkg && pipx install lean-pkg` once.
    breaking: false
    changelog: Changed
  - pr: 422
    id: recommend-notice-pypi
    kind: behavior
    area: registry
    summary: >-
      The upgrade route in the `registry recommend` notice and doctor's `recommended` line is
      `pipx install --force 'lean-pkg==X.Y.Z'` (PyPI) when the recommended release is 0.25.0 or later; an
      older recommendation keeps the git-tag route, an editable install `git -C <checkout> pull --ff-only`.
    action: >-
      Nothing. A script that matched the notice's `git+https://...@vX.Y.Z` text matches `lean-pkg==X.Y.Z` too.
    breaking: false
    changelog: Changed
  - pr: 419
    id: coverage-conclusion-strength
    kind: format
    area: coverage, page
    summary: >-
      Proposal 0010: a paper row of coverage/1 may carry conclusion (full, weaker or special-case; absent means
      full) and conclusion_scope (one line, what the Lean proves relative to the paper's result: required for
      weaker and special-case, refused otherwise; both refused on an outside row and on a library row). The
      class still names the hypotheses only. page never calls a verified weaker or special-case result the bare
      "Verified.": it says "Verified: a weaker statement." or "Verified: a special case.", adds a "Conclusion."
      line with the scope and counts them in the header's verified line; coverage check --json gains
      conclusions and page --json gains verified_conclusions. The schema string stays coverage/1.
    action: >-
      Nothing for files without the keys: they validate and render byte for byte as before. A coverage.yaml that
      uses conclusion or conclusion_scope needs this release or later (an older lean-pkg refuses the keys,
      because coverage/1 is strict), so raise the lean-pkg pin of its CI before committing them.
    breaking: false
    changelog: Added
  - pr: 423
    id: status-recorded-commit
    kind: behavior
    area: status
    summary: >-
      status's scope.gate gains recorded_commit (from the latest gate-passed/regated event for gate.receipt)
      and commit_source (checkout|recorded|null); without a readable receipt in a checkout, the text names the
      recorded commit, labelled "recorded by the gate; ... not checked against one", instead of "unreadable".
    action: >-
      Nothing. A script that read history[-1].commit for this should read scope.gate.recorded_commit; commit
      and readable are unchanged.
    breaking: false
    changelog: Added
no_author_change: [417, 424]
