# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.13.0. Same keys as 0.13.0.yaml; the human page is docs/upgrades/0.14.0.md.
schema: lean-pkg-upgrade-record/1
version: 0.14.0
changes:
  - pr: 260
    id: blueprint-check-checkdecls
    kind: command
    area: blueprint, claims
    summary: >-
      New read-only command blueprint check NAME [--decls PATH]: on a clean checkout it runs lake build, then
      lake exe checkdecls blueprint/lean_decls (PatrickMassot/checkdecls, the declaration list leanblueprint
      writes from the \lean{} tags), reports every name checkdecls prints as missing, and checks that each
      claim in claims.yaml at HEAD whose decl the blueprint names is a declaration checkdecls accepts. A
      package without a blueprint is skipped (exit 0); exit 1 on a missing name or a claim problem. checkdecls
      must be a Lake dependency of the package (lean-pkg never edits the lakefile). No file format changes.
    action: >-
      Optional, for a package with a blueprint: add require checkdecls from git
      "https://github.com/PatrickMassot/checkdecls.git" @ "3d425859e73fcfbef85b9638c2a91708ef4a22d4" (or the
      lakefile.toml [[require]] form in docs/page.md), run lake update checkdecls, commit the lakefile and
      lake-manifest.json, then lean-pkg blueprint check NAME.
    breaking: false
    changelog: Added
  - pr: 262
    id: receipt-claim-axioms
    kind: format
    area: receipts, gate, receipt check, page, new
    summary: >-
      Receipts gain the additive key claim_axioms {checked, nonstandard, missing}: the axioms of every claim
      in claims.yaml, read after the build by a core-Lean program (ClaimAxioms.lean, collectAxioms on the
      built environment) that receipt slurm --template and the verify.sh of lean-pkg new now run, its lines
      in the sealed log. A claim missing from the environment, one on sorryAx, a claim without a line, an
      incomplete probe or a #print axioms result that disagrees refuses the receipt; gate refuses an axiom
      outside gate.axioms_allowed. Proposal 0005 (accepted). No schema bump; a receipt without the key is
      valid as before.
    action: >-
      Before adopting it, make every decl in claims.yaml the fully qualified name of a compiled declaration
      (a bare or partial name refuses the receipt); python3 -m lean_pkg.claim_axioms --project . reports any
      that are not. Optional otherwise. To record it, regenerate verify.sbatch with lean-pkg receipt
      slurm --template, or copy the claim-axioms block of a fresh lean-pkg new verify.sh into yours. Every claim's decl must then be the
      fully qualified name of a declaration the build compiles (a bare name is reported missing and the
      receipt is refused); python3 -m lean_pkg.claim_axioms --project . checks it before a job.
    breaking: false
    changelog: Added
  - pr: 261
    id: claims-judged-as
    kind: format
    area: claims, receipt check, comparator, claims ledger, coverage check, page
    summary: >-
      claims.yaml (claims/1) accepts an optional judged_as on a theorem or lemma claim: the full name of the
      comparator theorem that judges it when the Challenge theorem is not named after the decl (an Audit
      namespace). It replaces the naming rule for that claim in every check that credits a comparator name
      (receipt check's claimed theorems, the claims ledger, comparator config --coverage, coverage check R11,
      page, claims mark, status). The schema refuses it on other kinds and the same name on two claims;
      receipt check fails one that names no configured theorem or whose decl is not declared, whatever the
      status. comparator config --coverage --json gains judged_as_problems. Proposal 0006 (accepted). No schema
      bump; a claims file without the key is unchanged. lean-pkg 0.13.0 and older refuse the key.
    action: >-
      Nothing for a package whose Challenge theorems follow the naming rule. A package whose claims name
      library theorems while its comparator judges Audit names adds judged_as to each judged claim, requires
      this lean-pkg release or later (older ones refuse the key), and gates the new commit: claims.yaml is
      bound to the receipt commit, so neither the evidence-only nor the docs-only rule admits the change.
    breaking: false
    changelog: Added
  - pr: 263
    id: comparator-tool-builds-own-toolchain
    kind: behavior
    area: comparator (legacy mechanism)
    summary: >-
      comparator-check.sh builds comparator and lean4export with ELAN_TOOLCHAIN unset, so each tool builds
      under its own lean-toolchain (the pinned comparator's is v4.34.0-rc1) and the log names it on an
      "== <tool> toolchain:" line. Since #41 the runner exports ELAN_TOOLCHAIN (the project's toolchain) to
      every child, and 0.13.0 built the comparator under the project's Lean: below v4.34 that failed with
      Main.lean:221 Lean.Kernel.Environment.replay does not exist. The project's own steps keep the project
      toolchain; the receipt's toolchain_resolution is unchanged.
    action: >-
      Nothing. A COMPARATOR_LAKE=$HOME/.elan/bin/lake set only to work around this can be dropped (the
      receipt then records toolchain_resolution.source elan instead of env). A TOOLS_DIR whose comparator
      build failed under the wrong toolchain rebuilds on the next run.
    breaking: false
    changelog: Fixed
