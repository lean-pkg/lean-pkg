# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.26.0. Same keys as 0.26.0.yaml; the human page is docs/upgrades/0.27.0.md.
# The name 0.27.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.27.0
changes:
  - pr: 428
    id: page-check-site-html-blocks
    kind: behavior
    area: page
    summary: >-
      page --check --site DIR also reads every hand-written *.md under DIR (outside _*, .*, site/,
      node_modules/ and vendor/ directories). A <details>, <div>, <section>, <aside>, <article> or
      <blockquote> block that holds Markdown (a table row, fence, list item, heading, quote, or inline
      emphasis, code or link) without a markdown attribute is a problem (exit 1), naming the file and line:
      GitHub Pages (kramdown) and MkDocs (md_in_html) publish such a block as literal text, while github.com
      renders it, so it passed review. Fenced code is never read. page --check --site --json gains
      html_blocks[] {path, line, tag, sample}; other page modes print the same JSON as before. Two companion sites had shipped 27 and 57 such blocks.
    action: >-
      Before relying on page --check --site in CI, run it once: for each block it names, write the opening
      tag as <details markdown="1"> (a bare markdown attribute also works) and keep a blank line before the
      Markdown inside. Nothing to do for a site without such blocks, or without --site.
    breaking: true
    changelog: Changed
  - pr: 437
    id: coverage-row-witness
    kind: format
    area: claims, claims ledger, coverage, page
    summary: >-
      Proposal 0011: a claims.yaml witness is accepted on any claim, not only a conditional one, and a claim that
      sets only witness keeps its status when the facts to judge the witness are missing (the witness is then
      unchecked, with why). coverage/1 rows (paper and library) gain an optional witness, the claims.yaml witness
      of one of the row's claims; refused on an outside row and when it is not such a witness. page shows
      "Hypotheses can be met." with the ledger's state (checked, not yet checked, wrong type), a header clause
      and one sentence in the reading note; coverage check --json gains witnesses, page --json
      verified_with_witness when a row names a witness.
    action: >-
      Nothing for files without the key: they validate and render as before. A claims.yaml that sets witness on
      a claim without hypotheses, or a coverage.yaml that uses the row key, needs this release or later (an older
      lean-pkg refuses both), so raise the lean-pkg pin of its CI before committing them.
    breaking: false
    changelog: Added
# Documentation only: 14 relative .md links whose text wrapped across a line were published unconverted
# (jekyll-relative-links matches one-line link text) and 404ed on the site; the 0003 prototype directory
# link had no index page (#427).
  - pr: 432
    id: public-safety-derived-common-words
    kind: behavior
    area: public-safety
    summary: >-
      public-safety derives no pattern from a common workflow word (commit, push, receipt, gate, lean,
      notes, refresh, ...) in a record's or lease's agent, workspace or contact: a lease workspace
      "public-allow commit" had made every "commit" in the receipts a blocking hit (172 on one package).
      Identifiers in the same text (a machine name) are still derived.
    action: >-
      Nothing. A scan that failed only on such a word now passes; real names in those fields are still caught.
    breaking: false
    changelog: Fixed
# Docs: proposal 0011 (non-vacuity witnesses on coverage rows) drafted and marked accepted 2026-11-07;
# no code changes (#430).
# Documentation only: the 10 wrapped relative .md links in the released 0.17.0, 0.18.1, 0.19.0 and 0.20.0 pages
# now have one-line link text (line breaks moved, no word changed; RELEASING.md, "Released records"), with tests
# that a released page keeps its words and that no relative .md link text crosses lines (#431).
no_author_change: [427, 429, 430, 431]
