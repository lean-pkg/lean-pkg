# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.12.0. Same keys as 0.12.0.yaml; the human page is docs/upgrades/0.13.0.md.
schema: lean-pkg-upgrade-record/1
version: 0.13.0
changes:
  - pr: 245
    id: receipt-container-image
    kind: format
    area: receipts, page
    summary: >-
      Receipts gain the additive key container {engine, image_sha256 (SIF) or oci_digest, ref} when the job
      ran in a container: receipt slurm --template takes the image digest before the build (CONTAINER_IMAGE,
      or a .sif word of RUN) and seals it on the log and the stdout; comparator-receipt records the SIF named by
      APPTAINER_CONTAINER when readable. receipt check shows it (a malformed one fails); the page names the
      engine and digest. No schema bump; a receipt without it is unchanged.
    action: >-
      Optional. To record the image, regenerate verify.sbatch with lean-pkg receipt slurm --template (or set
      CONTAINER_IMAGE in it); after the next receipt, page NAME --write shows the digest.
    breaking: false
    changelog: Added
  - pr: 239
    id: extract-disabled-lean-warning
    kind: behavior
    area: extract
    summary: >-
      lean-pkg-extract plan warns, in one warnings[] entry, about every file under a root whose name is
      *.lean.<suffix> (Foo.lean.disabled, .lean.off, .lean.skip) that the plan excludes or refuses as
      unclassified: the module inventory and the import check read *.lean only, so a stale open or
      import in such a disabled negative fixture went unreported after a namespace or import transport.
      ok and the exit code do not change; *.lean, *.olean and *.ilean are not matched.
    action: >-
      Nothing is required. If the warning names files, run each one's expected-reason check
      (lean_pkg.lean_diag; docs/extract.md, "Disabled negative fixtures after a namespace or import
      transport").
    breaking: false
    changelog: Added
  - pr: 240
    id: dup-constants-path-subdir-deps
    kind: behavior
    area: tests
    summary: >-
      lean_pkg.dup_constants resolves lake-manifest.json packages as Lake lays them out: a path package at
      its dir (relative to the manifest's directory, e.g. vendor/NAME) and a git package at
      packagesDir/name/subDir when it has a subDir. 0.12.0 looked every package up at packagesDir/name and
      refused a project with vendored path dependencies before the audit. A dir, subDir or packagesDir that
      is absolute, leaves its base or goes through a symlink is refused.
    action: Nothing; projects with path or subDir dependencies can now be audited.
    breaking: false
    changelog: Fixed
  - pr: 244
    id: large-artifact-pack-guards
    kind: behavior
    area: docs (receipts recipe)
    summary: >-
      The large-artifact recipe's pack-artifacts.sh (docs/receipts.md) refuses, before it creates OUT, an
      OUT that is RAW or lies inside it and a RAW inside OUT (compared after realpath -m), and two paths
      in RAW that are hardlinks of one file, naming them. Before, a nested OUT was packed into its own
      archive, and a hardlink packed fine but unpack-verify.py refused the archive at collection.
    action: >-
      If you committed a copy of pack-artifacts.sh from 0.12.0, replace it with the page's current
      version. Keep OUT next to RAW (raw and sealed, not raw/sealed); copy a RAW with internal hardlinks
      without links (cp -r --no-preserve=links) before packing.
    breaking: false
    changelog: Fixed
  - pr: 250
    id: systemd-require-tools-remain-after-exit
    kind: command
    area: receipts
    summary: >-
      receipt systemd --run gains --require-tools A,B,... (repeatable): before the unit is created each
      named executable must resolve like type -P in the unit's PATH, else the run is refused and nothing is
      started; resolved paths, real paths and SHA-256 go to stderr and --json run_tools, never into the
      receipt. The exported unit property set gains RemainAfterExit, recorded and never required (captures
      and receipts without it stay valid); the exact set is documented. MainPID is not exported.
    action: >-
      Optional. Commit a per-version run-tools list beside the verify script and pass it with
      --require-tools (docs/receipts.md, "Run tools"); a wrapper reading unit.properties should require only
      the documented required properties.
    breaking: false
    changelog: Added
  - pr: 246
    id: toolchain-advisories
    kind: behavior
    area: gate, receipt check, palomar check, page
    summary: >-
      gate, gate --check, receipt check and palomar check print one WARN line per entry of the shipped
      toolchain advisories list (src/lean_pkg/data/toolchain-advisories.yaml) that names the receipt's
      lean_toolchain (any release before v4.34.1, and v4.35.0-rc1 and -rc2), and their --json gains
      toolchain_advisories[]; never a refusal. page --write adds a Toolchain advisory line under How
      this was checked; page --check leaves advisory lines out of its comparison, so an existing page
      stays current, and prints a non-failing NOTE per advisory the page does not show yet.
    action: >-
      Nothing is required. The next page --write shows the advisory line; rebuilding on the fixed
      release and re-gating removes the warning. Scripts that match gate's stderr may see the new WARN
      lines.
    breaking: false
    changelog: Added
