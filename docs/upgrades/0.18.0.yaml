# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.17.0. Same keys as 0.17.0.yaml; the human page is docs/upgrades/0.18.0.md.
schema: lean-pkg-upgrade-record/1
version: 0.18.0
changes:
  - pr: 275
    id: preflight-deps-fill-plan
    kind: command
    area: receipt slurm
    summary: >-
      New flags receipt slurm --preflight-deps --fill-plan DONOR [--plan-out FILE] [--base-list FILE] (field
      report #5): steps 1-4 of the donor-fill recipe in docs/receipts.md, read-only. It keeps every missing
      module of the base cache (the 500 cap of missing[] is for display only), checks the donor
      (lean-toolchain byte for byte, every manifest rev, no source edits by git status, the first 80 bytes of
      each candidate .olean equal to the base's), lists every file the donor holds under each module's path
      (all artifact families) with size and sha256, and refuses an addition that is a base member, under one,
      under the package's own .lake/build or in its root namespaces. Each refusal has its own code
      (refusals[].code), exit 1. With --plan-out, only when the plan is sound, it writes the additions list and
      FILE.provenance.json (collector provenance, never a job seal). It writes no archive and never touches the
      base, the donor or .lake/build; without --fill-plan nothing changes.
    action: >-
      Nothing for a package author. When --preflight-deps names missing modules and another cache built from
      the same pins holds them, run the plan with --fill-plan DONOR --plan-out add.list, write the new archive
      by hand (docs/receipts.md, steps 5-7) and rerun --preflight-deps on it before submitting.
    breaking: false
    changelog: Added
  - pr: 276
    id: json-escapes-control-characters
    kind: behavior
    area: --json
    summary: >-
      A lab field report said status NAME --json printed a raw control character that strict json.loads
      refused ("Invalid control character"). The payload lean-pkg prints was valid: the report's copy had
      been printed through zsh's echo, which turns the \n and — escapes of a notes string back into a
      raw newline and a dash. That every --json payload escapes control characters (U+0000 to U+001F), also
      when they come from registry notes and history, is now a documented guarantee (help formatting,
      ESCAPING) and a test runs every command of the --json contract table on a registry whose notes and
      history hold every C0 control, DEL, U+2028 and U+2029, parsing with strict json.loads and checking
      the strings round-trip. The output itself is unchanged.
    action: >-
      Nothing for a package author. A script that captures --json in a variable should print it with
      printf '%s\n' "$out", or pipe or redirect the command, never echo it.
    breaking: false
    changelog: Fixed
