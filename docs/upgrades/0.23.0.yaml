# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.22.0. Same keys as 0.22.0.yaml; the human page is docs/upgrades/0.23.0.md.
# The name 0.23.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.23.0
changes:
  - pr: 391
    id: gate-check-palomar-advisory-intent
    kind: behavior
    area: gate
    summary: >-
      gate --check prints its Palomar advisory (WARN: palomar: not submittable ...) only for a package that aims
      at Palomar (#387): upstream_target palomar or a recorded Palomar entry, and a status other than scratch,
      archived or upstreamed, the predicate registry audit uses. Any other package gets no WARN. JSON
      palomar_check gains skipped: null for a package aiming at Palomar, "not aiming at Palomar" for any other,
      whose readiness fields are still filled. publish --dry-run and palomar check are unchanged.
    action: >-
      Nothing. To keep the advisory for a package headed to Palomar, run lean-pkg update NAME
      --upstream-target palomar; a script reading gate --check --json palomar_check sees one more key.
    breaking: false
    changelog: Changed
  - pr: 389
    id: report-intake-fields
    kind: command
    area: report
    summary: >-
      New report flags --expected TEXT (fills What you expected), --workaround TEXT (a Workaround section after it)
      and --blocking yes|no (a Blocking line before Version; another value exits 2), each rendered only when
      given; the two texts are redacted like --body and scanned by the blocking guard. The first line of every
      report body, in the dry run, the filed issue and --json, is the marker <!-- lean-pkg-report/1 -->, and
      --json gains schema: lean-pkg-report/1. Without the new flags the body only gains that first line.
    action: >-
      Nothing required. A script that reads report's body by line number sees one more line at the top; one that
      checks --json's key set exactly sees the new schema key.
    breaking: false
    changelog: Added
  - pr: 390
    id: gate-check-next-command
    kind: behavior
    area: gate
    summary: >-
      gate --check takes --agent A (issue 386): it runs the check and notes on stderr that --check takes no
      lease and --agent A is for the writing gate; it was a usage error (exit 2). --check
      --refresh-formalization is still refused (it writes). A passing check, on a status the writing gate
      takes, ends with 'next: lean-pkg gate NAME --receipt R ... --agent A' (the evidence flags it was given,
      shell-quoted; --agent A when given, else the placeholder AGENT), and --json gains next_command (that
      string, null when the check fails or the status needs another step first). After --check --repo DIR
      away from the registered local_path a line adds that the writing gate binds the registered checkout
      (run it there, or move the record with update NAME --path DIR --reason TEXT).
    action: >-
      Nothing required. A script that called gate --check without --agent keeps working; one that read the
      exit 2 of --check --agent now gets the check's own exit code. Run the printed next: command to record
      the gate.
    breaking: false
    changelog: Changed
  - pr: 394
    id: port-modules-package-scope
    kind: behavior
    area: palomar port-modules, verify
    summary: >-
      palomar port-modules (issue 392) lists the package's untracked .lean files it did not read (it reads HEAD):
      'N untracked .lean file(s) under DIR/ not read (port-modules reads HEAD): commit them first', and says
      'nothing to port at HEAD (N untracked ...)' instead of a bare 'nothing to port'; --json gains
      untracked_lean[]. --write checks the cleanliness of the package directory only (git status -- DIR, plus
      the files it writes): a dirty or untracked path inside the package still refuses, paths elsewhere in the
      repository no longer block; the refusal and --json (clean_scope, "." at the root) name the scope. A
      package at the repository root is unchanged. verify's step 0 runs the same import scan at HEAD and warns
      (never refuses) when a module-headed file imports a non-module file of the package, naming the files and
      lean-pkg palomar port-modules NAME --dry-run; the step-0 JSON output gains module_imports[] and
      warnings[].
    action: >-
      Nothing required. Commit new .lean files before port-modules if it lists them; a package embedded in a
      larger repository can now --write with unrelated changes elsewhere. On the verify warning, run the
      printed port-modules dry run.
    breaking: false
    changelog: Changed

  - pr: 393
    id: lease-registry-stamp
    kind: behavior
    area: status, registry
    summary: >-
      status, gate --check, lease list and the lease warning name the registry commit their lease state was read
      from: on a registry git clone the lease line ends "(as of registry SHA7, committed AGE ago)", status also
      prints the line for a live lease and for none, and --json gains registry_state {root, commit, committed_at,
      age_seconds, branch, upstream, behind, ahead, dirty} (null outside a git clone). A clone behind the
      origin/BRANCH it last fetched prints one stderr warning with the git pull --ff-only that fixes it. Local refs
      only; read-only commands still never fetch (#385).
    action: >-
      Nothing required. A script that reads status's last text line, or checks the --json key set of status,
      gate --check or lease list exactly, sees the stamp and the new registry_state key.
    breaking: false
    changelog: Changed
  - pr: 395
    id: registry-recommended-version
    kind: command
    area: registry
    summary: >-
      New registry recommend X.Y.Z (issue 388) sets the registry's optional top-level lean_pkg: {recommended:
      X.Y.Z} (additive; schema version stays 3; an older lean-pkg ignores the key and keeps it on save) and
      appends the log-only event registry-recommended {recommended, previous, reason}. When the running
      lean-pkg is older (compared on X.Y.Z; a dev build 0.23.0.dev1 counts as 0.23.0), every writing command
      (registry writes; receipt slurm, systemd, ci and comparator outside their read-only forms) ends with one
      stderr line 'lean-pkg: notice: this is lean-pkg A.B.C; the registry recommends X.Y.Z (upgrade: ...)',
      offline and never a refusal, and a registry write's --json gains lean_pkg_skew {running, recommended}
      (absent when not older). doctor gains a recommended line; registry validate checks the key's shape.
    action: >-
      Nothing required. Whoever upgrades a shared registry can run lean-pkg registry recommend X.Y.Z --commit;
      a script that checks a writing command's --json key set exactly may see lean_pkg_skew, and one that
      reads doctor's lines sees one more.
    breaking: false
    changelog: Added
  - pr: 400
    id: comparator-receipt-contracts-only-hint
    kind: behavior
    area: comparator
    summary: >-
      receipt comparator (comparator-receipt) ends a refusal whose judge log carries Lake's 'Challenge and solution
      theorem statement do not match' or 'Const does not match between challenge and target' with one stderr line
      'next: lean-pkg comparator check NAME --contracts-only' (issue 397), once per run, with --repo DIR when the
      run's checkout is not the registered one; NAME from a best-effort read-only registry lookup (local_path,
      else git remote), else the literal NAME and the docs section. stages.json, a kept attempt's attempt.json
      and its --attempts --json row gain next_command (null otherwise). Display only: the comparison, the
      checker, every verdict, the exit code and the receipt are unchanged; other failures get no line.
    action: >-
      Nothing required. On such a refusal, run the printed contracts-only diagnostic to see the first differing
      field; a script that checks the key set of stages.json or --attempts --json exactly sees next_command.
    breaking: false
    changelog: Changed
  - pr: 399
    id: page-published-unanchored-manuscript
    kind: behavior
    area: page
    summary: >-
      page (issue 396): when coverage.yaml manuscript.version is unposted and the registry record's paper.status
      is published (update NAME --paper-status published), the page cites the paper as '*Title* (published; the
      exact source the paper numbers refer to is not publicly anchored)' and its note reads 'Published; source
      not publicly anchored' (a reader cannot check the paper numbers against a posted version; anchor an arXiv
      version with formalization anchor, or a public {repo, commit, sha256} source), instead of 'Manuscript not
      yet posted' and 'an unposted draft'. The README block, --site and --html files carry the same text.
      --json gains paper_status (the record's paper.status, or null) and manuscript_note
      ("published-unanchored", else null); manuscript and private_manuscript are unchanged. Every other case
      renders as before, and --allow-private-manuscript is still required for unposted.
    action: >-
      For a published paper rendered from an unposted manuscript: run lean-pkg page NAME --write
      --allow-private-manuscript; page --check reports the old block as stale. A script that checks page
      --json's key set exactly sees paper_status and manuscript_note.
    breaking: false
    changelog: Fixed
  - pr: 403
    id: palomar-prepare-handoff-checklist
    kind: behavior
    area: palomar prepare
    summary: >-
      palomar prepare (issue 402): the bundle's README.txt is a staged handoff checklist: 1 static readiness
      (what lean-pkg checked at the commit, and that it is not Palomar's full preflight), 2 the full mechanical
      preflight (PalomarSubmission's reusable workflow .github/workflows/submission.yml, mode full,
      execution_profile palomar-standard-v1, uses and pipeline_commit pinned to the same full commit the live
      contract names; a local lake build, a CI job or a standalone comparator run is not equivalent), 3 the
      approval fields to show the user before intake (repository, commit, comparator_config_path pre-filled;
      authorization_relationship for the user to state), 4 intake, proof and cleanup per the live agent
      contract https://submit.palomar-registry.org/llms.txt (linked, not copied), 5 editorial review, 6
      registration only on the user's decision, 7 the record palomar-submitted command. --json gains handoff
      {stages, approval_fields, agent_contract, full_preflight}. No network request; receipts, configs,
      MANIFEST and refusals unchanged. Classified with OTHER_AREAS: the bundle copies receipts and adds
      documentation; it changes neither what a receipt holds nor how one is judged.
    action: >-
      Nothing required. Before submitting a prepared bundle, follow its README.txt stages in order; a script
      that checks palomar prepare --json's key set exactly sees handoff, and one that reads README.txt by line
      number sees the new layout.
    breaking: false
    changelog: Changed
  - pr: 401
    id: page-built-not-compared
    kind: behavior
    area: page
    summary: >-
      page (issue 398): a result block whose claims that are not verified are all open only for the ledger
      reason no-comparator-config (gate and comparator receipts pass, no comparator configuration names the
      declaration) reads '**Built, not compared.** Lean accepts the proof (the build passed), but its statement
      has not yet been compared by a second checker, which this result requires.' instead of '**Not yet
      verified.** ... read the Lean statement below as work in progress.', in the README block, --site and
      --html. Display only: ledger statuses, verified counts, the coverage.md Ledger column and page --json
      are unchanged; every other not-verified row keeps its wording.
    action: >-
      Nothing required. Re-run lean-pkg page NAME --write (and --site/--html) to refresh a committed page;
      page --check reports the old wording as stale until then.
    breaking: false
    changelog: Fixed
