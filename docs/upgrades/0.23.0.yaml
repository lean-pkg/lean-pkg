# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.22.0. Same keys as 0.22.0.yaml; the human page is docs/upgrades/0.23.0.md.
# The name 0.23.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.23.0
changes:
  - pr: 391
    id: gate-check-palomar-advisory-intent
    kind: behavior
    area: gate
    summary: >-
      gate --check prints its Palomar advisory (WARN: palomar: not submittable ...) only for a package that aims
      at Palomar (#387): upstream_target palomar or a recorded Palomar entry, and a status other than scratch,
      archived or upstreamed, the predicate registry audit uses. Any other package gets no WARN. JSON
      palomar_check gains skipped: null for a package aiming at Palomar, "not aiming at Palomar" for any other,
      whose readiness fields are still filled. publish --dry-run and palomar check are unchanged.
    action: >-
      Nothing. To keep the advisory for a package headed to Palomar, run lean-pkg update NAME
      --upstream-target palomar; a script reading gate --check --json palomar_check sees one more key.
    breaking: false
    changelog: Changed
  - pr: 389
    id: report-intake-fields
    kind: command
    area: report
    summary: >-
      New report flags --expected TEXT (fills What you expected), --workaround TEXT (a Workaround section after it)
      and --blocking yes|no (a Blocking line before Version; another value exits 2), each rendered only when
      given; the two texts are redacted like --body and scanned by the blocking guard. The first line of every
      report body, in the dry run, the filed issue and --json, is the marker <!-- lean-pkg-report/1 -->, and
      --json gains schema: lean-pkg-report/1. Without the new flags the body only gains that first line.
    action: >-
      Nothing required. A script that reads report's body by line number sees one more line at the top; one that
      checks --json's key set exactly sees the new schema key.
    breaking: false
    changelog: Added
