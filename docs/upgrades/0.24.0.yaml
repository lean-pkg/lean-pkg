# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.23.0. Same keys as 0.23.0.yaml; the human page is docs/upgrades/0.24.0.md.
# The name 0.24.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.24.0
changes:
  - pr: 405
    id: palomar-check-module-root-shadowed
    kind: behavior
    area: palomar check
    summary: >-
      #404: palomar check reports a comparator configuration whose challenge_module or solution_module has a
      top-level root R (the text before the first '.') that is also a top-level R.lean or R/ of a dependency's
      source tree: the error gap challenge.module_root_shadowed or solution.module_root_shadowed, Palomar's own
      code (its full preflight refuses it before any kernel runs). Still offline: each dependency
      lake-manifest.json pins at the commit is read from its checkout under .lake/packages/<name>/ only when that
      checkout's HEAD is the pinned rev (a path dependency inside the repository from the commit), at the
      package root and each srcDir its lakefile states literally. A dependency not read is named in not_checked,
      and a bare root Challenge, Solution or Main then gets the warn gap challenge.module_root_generic or
      solution.module_root_generic. When every dependency was read, not_checked drops the shadowing clause.
    action: >-
      For the error, move the module under a package-qualified root such as MOD.Challenge (the layout lean-pkg
      new scaffolds), set it in the configuration, rebuild, commit, re-run comparator-receipt and re-gate. The
      warning never changes readiness or the exit code; run lake build so the dependencies are checked out at
      their pins and re-run palomar check to settle it. A script that expects an empty gaps list for a bare
      Challenge root, or an exact not_checked list, sees the change.
    breaking: false
    changelog: Added
  - pr: 407
    id: lake-manifest-quoted-package-names
    kind: behavior
    area: comparator check, palomar check, receipt slurm, lean-exercise
    summary: >-
      #406: a lake-manifest.json package name that Lake writes escaped (for example «dep-with-hyphens», from
      Lean's ToJson Name) is now read as the directory Lake checks it out under (.lake/packages/dep-with-hyphens,
      Lake's name.toString (escape := false)) by comparator check --contracts-only (and the duplicate-constant
      probe), palomar check's dependency scan, receipt slurm's dependency closure and exercise --project, which
      looked for .lake/packages/«dep-with-hyphens» and called the dependency not checked out. Two entries that
      decode to the same package, and a name Lake would not write or one that decodes to a path, are refused.
    action: >-
      Nothing to change. A project whose manifest has a quoted name, refused before as "not checked out", now
      runs; the origin label of a quoted dependency in comparator check output is the unescaped name.
    breaking: false
    changelog: Fixed
  - pr: 408
    id: contracts-only-let-hint
    kind: behavior
    area: comparator check
    summary: >-
      LO-20261030-04: comparator check --contracts-only adds a hint when the first differing subterm of a type or
      value is a `let` on one side only (a Challenge that keeps a `let` alias the Solution unfolds, or the
      reverse): the two are definitionally equal, but lake comparator compares the stored terms and refuses them.
      Display only; the verdict, the counts and the exit code are unchanged. docs/comparator.md gains "A let kept
      on one side" and "Before receipt work" (build the configured modules, run the contracts-only diagnostic,
      then launch receipt systemd or slurm); how-to and the receipt systemd and slurm pages point to it.
    action: >-
      Nothing. A script that reads the hint field of a difference sees text in a case where it was null before.
    breaking: false
    changelog: Changed
