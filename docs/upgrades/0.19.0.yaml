# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.18.1. Same keys as 0.18.1.yaml; the human page is docs/upgrades/0.19.0.md.
# The name 0.19.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.19.0
changes:
  - pr: 281
    id: json-stdout-only
    kind: behavior
    area: --json
    summary: >-
      Under --json, stdout is the JSON document alone (a field report from a two-library release campaign).
      comparator-receipt --estimate --json (also lean-pkg receipt comparator --estimate --json) printed the
      stage lines, the per-slot progress and the streamed judge output on stdout before the JSON, so
      json.loads(stdout) failed although every slot passed; that output now goes to stderr. The global
      lean-pkg --json before receipt comparator was ignored (the text output reached stdout): it now means
      the runner's own --json for --estimate, --verify-oleans, --attempts and --seal-sacct, and a run or
      --prepare under it is refused (exit 2, one JSON error) like the runner's --json without --estimate.
      receipt slurm --template --json printed the raw script; it now prints {ok, template}.
    action: >-
      Nothing for most package authors. A script that cut the estimate JSON out of mixed stdout (from the
      first brace) can parse stdout whole now; the artifact comparator-stages/04-comparator.estimate.json
      is unchanged and remains the recommended machine-readable source. Drop a global --json in front of
      a receipt comparator run or --prepare.
    breaking: false
    changelog: Fixed
  - pr: 282
    id: public-safety-long-line-stream
    kind: behavior
    area: public-safety
    summary: >-
      A field report had public-safety (history, strict, whole repository, --gzip-limit 512M) killed for
      memory at a 2 GiB limit about 30 s in, on a gzip file holding one 333,681,168-byte JSON line with
      four-byte UTF-8 characters, inside the decode limit and the ratio guard. The gzip path kept the
      whole unfinished line, decoded it in one piece (a Python string of such text takes four bytes a
      character) and split it into lines again; UTF-16/32 gzip content was held and decoded whole. Decoded
      text now goes through an incremental decoder (same errors="replace" handling; a multi-byte sequence
      split between two reads is never cut) and a line scanner that scans a long line in the same
      overlapping chunks (20000 characters, overlapping by 1000) as it arrives, with the same line numbers
      and the same one hit per pattern per line; a binary decode's printable runs are streamed the same
      way, and scan_text no longer copies a long line or lists every line. On a 64 MiB line the scan's
      peak traced memory went from about 540 MiB to about 8 MiB. Limits, guards, strictness, which files
      are scanned and the hits reported are unchanged.
    action: >-
      Nothing for a package author. A scan that ran out of memory on a long line in a gzip file can be run
      again.
    breaking: false
    changelog: Fixed
  - pr: 283
    id: comparator-contracts-only
    kind: command
    area: comparator check
    summary: >-
      New flag comparator check NAME --contracts-only [--config PATH]... [--export MODULE=FILE]...
      [--no-sandbox] (#280): a read-only diagnostic of the compare step of every comparator configuration
      of the checkout at once. Each module is exported once with the toolchain's leanexport (bwrap unless
      --no-sandbox), then Lake's own Lake.Check.compareAt and Lake.Check.checkAxioms judge each
      configuration exactly as lake comparator's compare step does. A differing configuration gets Lake's
      message, the breadcrumb from the target to the refused constant, the first differing ConstantInfo
      field (Expr BEq, as Lake compares) and the first differing subterm. No kernel runs; no receipt,
      event or file in the checkout is written; JSON acceptance false, never acceptance. Lean v4.35.0 or
      later.
    action: >-
      Nothing for a package author. Before spending a gate on many configurations, run lean-pkg comparator
      check NAME --contracts-only after lake build and fix every configuration it reports; the gate stays
      mandatory.
    breaking: false
    changelog: Added
no_author_change: []
