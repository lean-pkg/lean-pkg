# Curated upgrade record (schema lean-pkg-upgrade-record/1) for the next release, kept current as pull
# requests merge after 0.19.0. Same keys as 0.19.0.yaml; the human page is docs/upgrades/0.20.0.md.
# The name 0.20.0 is provisional (RELEASING.md, "The record's provisional name"): make cut-release
# renames both files to the version it cuts, which make release-version prints.
schema: lean-pkg-upgrade-record/1
version: 0.20.0
changes:
  - pr: 286
    id: registry-dir-resolves-file
    kind: behavior
    area: registry
    summary: >-
      --registry DIR and LEAN_PKG_REGISTRY=DIR now mean DIR/lean-packages.yaml, as the user-level default
      ~/.lean-pkg/registry already did. An explicit directory was refused as "registry not found ...
      (resolved from flag)" even when it held lean-packages.yaml; the registry lock and the event log now
      sit beside the resolved file. A directory without the file is refused naming DIR/lean-packages.yaml.
    action: >-
      Nothing for a package author. A script that passed the file path keeps working; one that passed the
      directory and got a refusal now works. An explicit --registry DIR with no --events now writes the
      event log inside DIR, beside the registry file, not in DIR's parent.
    breaking: false
    changelog: Fixed
  - pr: 292
    id: ledger-judged-internal-claims
    kind: behavior
    area: claims ledger
    summary: >-
      An internal claim the comparator judged now counts as verified. claims ledger (promote stage) gave
      every claim with claims.yaml status internal the status out-of-scope, even when a passing comparator
      receipt had compared its statement. Now an internal theorem or lemma is judged (new JSON field
      judged_internal, true) when the comparator tier is clean for the package (a valid, passing comparator
      receipt bound to the gate-bound commit) and a configuration at that commit names its declaration by
      the rule that credits a reusable claim (a scaffold TODO name does not count). A judged internal claim
      gets the reusable claim's diagnostics and is verified, open, blocked or unknown on the same evidence;
      it is never required, so the package status and the required count are unchanged. Every other
      internal claim (not named, a definition, the gate stage, no clean comparator receipt) stays
      out-of-scope. The text output tags a judged claim [internal, judged by the comparator]. counts and
      ledger_digest change for a package with a judged internal claim. The page adds an Internal. line to a
      result block that names an internal claim, and coverage.md adds (internal) to that claim's ledger
      status.
    action: >-
      Nothing for most package authors. A package whose coverage.yaml names an internal claim, or that has
      an internal claim a comparator configuration names, gets a different page: page NAME --check reports
      the README block (and --site files) stale until you run lean-pkg page NAME --write (and --site DIR)
      and commit. A script that read out-of-scope as "every internal claim" reads judged_internal.
    breaking: true
    changelog: Added
  - pr: 293
    id: signoff-smoke-configs
    kind: format
    area: lean-pkg-signoff.json, coverage check, claims ledger, comparator config --coverage and --from-claims, receipt check, page, formalization, status, claims mark, index add, index check
    summary: >-
      lean-pkg-signoff.json (lean-pkg-signoff/1) accepts an optional configs[<path>].smoke {reason}: the
      configuration is a smoke check, a sanity theorem that tests the comparator set-up and states no result
      of the package (an audit of public Lean repositories found such configurations next to the real ones).
      It is still judged and listed in the receipt and must pass, but its theorems credit no claim, by the
      naming rule or a judged_as (claims ledger, comparator config --coverage, receipt check, status);
      coverage check (R11) asks no row for them and refuses the mark when one is the declaration of a claim
      a row names; page shows them on a line "Smoke checks (not results)" and leaves them out of the
      statements shown as proved; formalization leaves them out of status.main_results, refuses a smoke
      headline configuration and lets no smoke configuration cover a headline name; index add and index
      check --clone judge no index headline by a smoke theorem (read at the pin, the receipt's commit and
      the default branch); comparator config --from-claims counts no smoke theorem as configured and refuses
      to scaffold into a smoke configuration; claims mark --from-comparator --status reusable refuses a
      smoke configuration. The mark is read at the comparator receipt's commit and at HEAD. No schema bump;
      a sidecar without the key is unchanged, and the receipt's signoff copy (definitions only) is
      unaffected, so recorded receipts stay valid. lean-pkg 0.19.0 and older refuse a sidecar that uses the
      key.
    action: >-
      Nothing for a package without a smoke configuration. A package whose comparator receipt lists a sanity
      configuration that coverage check refused (its theorem is the declaration of no claim) adds
      "smoke": {"reason": "..."} to that configuration's entry in lean-pkg-signoff.json, requires this
      lean-pkg release or later (older ones refuse the key), then reruns coverage check and page --write; no
      new receipt is needed.
    breaking: false
    changelog: Added
  - pr: 294
    id: receipt-slurm-seal-sacct
    kind: command
    area: receipt slurm
    summary: >-
      New flag receipt slurm --seal-sacct [--user NAME] (a field report). receipt slurm read --sacct-file
      (or live sacct) only for its own COMPLETED 0:0 check and the README elapsed/TotalCPU line; the
      written receipt sealed nothing, so on a host without Slurm the terminal state rested on a file any
      shell can write. With the flag the job's accounting record is sealed exactly as receipt comparator
      --seal-sacct seals a comparator receipt: Start..End (with a zone) must contain the verify log's
      generated-at: line and the account must be this one (live sacct) or --user; the normalized record
      <c12>-slurm-<J>-sacct.txt (JobID|State|ExitCode|Start|End|Elapsed, UTC, no user or node names) is
      written beside the receipt and the additive slurm_sacct block (schema slurm-sacct-seal/1, the
      comparator's) binds it. gate, gate --check, receipt check and every other validator of a lower-tier
      receipt (core.validate_receipt) then refuse a receipt whose sealed record is missing, uncommitted at
      HEAD, re-hashed or edited, through the comparator's receipt.sacct_seal_problem. Optional and
      additive: a receipt without the block is judged as before, and the JSON only gains keys
      (slurm_sacct, a sealed[] entry with role sacct.txt).
    action: >-
      Nothing for a package author. To keep the job's accounting record with a lower-tier receipt, add
      --seal-sacct to receipt slurm (on a host without Slurm, save the record with SLURM_TIME_FORMAT and
      the documented sacct --format, then pass --sacct-file and --user) and commit the -sacct.txt record
      with the receipt.
    breaking: false
    changelog: Added
  - pr: 291
    id: page-repo-head-anchors
    kind: behavior
    area: page
    summary: >-
      page --repo DIR read coverage.yaml and claims.yaml at DIR's committed HEAD but linked every Lean file
      and read every Lean statement at the commit the recorded gate receipt binds, and showed that
      receipt's facts, also when HEAD was a candidate commit the receipt does not bind (a field report: a
      result added since the last gate linked to a commit where its file did not exist, and its statement
      was "not committed at the checked commit"). The source links and Lean statements now come from DIR's
      committed HEAD whenever the gate receipt does not bind it (HEAD or an evidence-only descendant of its
      commit, the rule gate and formalization render --repo apply); the page then shows no receipt
      fact (axioms, sorry count, statement comparison, the receipt used), verifies no row, and says under
      its first heading which commit it reads and which commit the build check binds. When the receipt
      does validate at HEAD the page is unchanged. A receipt that binds HEAD but does not validate (axioms,
      sorry count, toolchain or Mathlib mismatch, a malformed field) is a failed check, not a preview: the
      page says "The recorded build check does not validate" with the reason, shows no receipt fact and
      verifies no row. JSON repo_override gains head, anchor_commit, source committed-head and receipt_facts
      {receipt, commit, included, binds_head, reason}; uncommitted changes to tracked files are never read
      and get a warning. page without --repo is unchanged.
    action: >-
      Nothing for most package authors. A CI job running page --check --repo keeps passing between gate runs:
      on a commit the recorded receipts do not bind, the differences of the preview from the receipt-bound
      README block and --site/--html files are warnings naming both commits (JSON preview true, current
      null), and real problems still fail. A receipt that binds the commit but does not validate now fails
      the check as a failed check: repair the receipt or run the gate again. To fail on preview drift too,
      add --strict-preview (entry page-check-strict-preview).
    breaking: false
    changelog: Fixed
  - pr: 291
    id: page-check-strict-preview
    kind: command
    area: page
    summary: >-
      New flag page --check --repo DIR --strict-preview. Without it, when DIR's committed HEAD is a preview
      (the recorded gate receipt does not bind it), the differences that come only from the preview (the
      README block, --site and --html files differing from the receipt-bound files committed there) are
      warnings that name the preview's commit and the commit the receipts bind, and the check exits 0; with
      it they are problems (exit 1). Real problems exit 1 either way: a missing README or page block,
      unbalanced markers, a missing lean-pkg credit, an unbacked site acknowledgment, a missing --site or
      --html file, a private-string hit, and a receipt that binds HEAD but does not validate. The flag is
      refused (exit 2) without both --check and --repo. page --json gains preview (true under a preview,
      else false); under a preview current is null, since the committed files are receipt-bound by design.
    action: >-
      Nothing required. A CI job that should fail whenever the committed page differs from the candidate
      commit's preview adds --strict-preview to its page --check --repo line. A script that read current
      from page --check --repo --json reads preview first: current is null under a preview.
    breaking: false
    changelog: Added
