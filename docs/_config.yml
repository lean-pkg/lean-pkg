title: lean-pkg
description: Lean checks the proofs. You check the statements. lean-pkg checks the receipts.
theme: jekyll-theme-cayman
show_downloads: false
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
include:
  - llms.txt
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
