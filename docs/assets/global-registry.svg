<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="title desc">
  <title id="title">lean-pkg global registry architecture</title>
  <desc id="desc">One installed lean-pkg CLI uses a private Git-backed global registry to coordinate many independent Lean research repositories. Each project keeps its own source and verification receipts. When a chosen project snapshot is made public, a planned index-submit workflow can open a pull request to the central lean-pkg index, where independent checks and human fidelity review precede merge.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .panel { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .registry { fill: #164e63; stroke: #0f3d4c; stroke-width: 2.5; }
      .project { fill: #1d4ed8; stroke: #1e3a8a; stroke-width: 2; }
      .public { fill: #0f766e; stroke: #115e59; stroke-width: 2; }
      .planned { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 7 5; }
      .review { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2; }
      .index { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
      .title { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .section { font-size: 16px; font-weight: 700; fill: #334155; }
      .label { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 13px; fill: #e2e8f0; }
      .dark { font-size: 14px; fill: #0f172a; }
      .darkb { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 12.5px; fill: #475569; }
      .note { font-size: 13px; font-style: italic; fill: #64748b; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow.pub { stroke: #0f766e; }
      .arrow.plan { stroke: #c2410c; stroke-dasharray: 7 5; }
      .thin { stroke-width: 2; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="720" rx="16"/>
  <text class="title" x="600" y="42" text-anchor="middle">One CLI · one private global registry · many independent research repos</text>

  <!-- CLI -->
  <rect class="panel" x="455" y="70" width="290" height="62" rx="12"/>
  <text class="darkb" x="600" y="96" text-anchor="middle">lean-pkg CLI</text>
  <text class="small" x="600" y="116" text-anchor="middle">installed once with pipx / uv</text>

  <!-- Registry -->
  <path class="arrow" d="M 600 134 V 166"/>
  <rect class="registry" x="365" y="168" width="470" height="122" rx="14"/>
  <text class="label" x="600" y="198" text-anchor="middle">Private global registry repo</text>
  <text class="sub" x="600" y="222" text-anchor="middle">~/.lean-pkg/registry/</text>
  <text class="sub" x="600" y="244" text-anchor="middle">lean-packages.yaml · lean-package-events.jsonl · .git/</text>
  <text class="sub" x="600" y="266" text-anchor="middle">cross-project state · leases · history · publication metadata</text>

  <!-- Project repos -->
  <rect class="bg" x="435" y="308" width="330" height="30" rx="6"/>
  <text class="section" x="600" y="329" text-anchor="middle">Independent research repositories</text>

  <path class="arrow" d="M 470 292 C 420 330, 300 330, 230 370"/>
  <path class="arrow" d="M 600 292 V 370"/>
  <path class="arrow" d="M 730 292 C 780 330, 900 330, 970 370"/>

  <g>
    <rect class="project" x="70" y="372" width="320" height="126" rx="12"/>
    <text class="label" x="230" y="402" text-anchor="middle">paper-a/</text>
    <text class="sub" x="230" y="426" text-anchor="middle">Lean source · manuscript links</text>
    <text class="sub" x="230" y="448" text-anchor="middle">Challenge/Solution · comparator config</text>
    <text class="sub" x="230" y="470" text-anchor="middle">.lean-receipts/ · its own .git/</text>
  </g>

  <g>
    <rect class="project" x="440" y="372" width="320" height="126" rx="12"/>
    <text class="label" x="600" y="402" text-anchor="middle">paper-b/</text>
    <text class="sub" x="600" y="426" text-anchor="middle">Lean source · discovery artifacts</text>
    <text class="sub" x="600" y="448" text-anchor="middle">private verification lifecycle</text>
    <text class="sub" x="600" y="470" text-anchor="middle">.lean-receipts/ · its own .git/</text>
  </g>

  <g>
    <rect class="project" x="810" y="372" width="320" height="126" rx="12"/>
    <text class="label" x="970" y="402" text-anchor="middle">paper-c/</text>
    <text class="sub" x="970" y="426" text-anchor="middle">Lean source · external citations</text>
    <text class="sub" x="970" y="448" text-anchor="middle">independent research history</text>
    <text class="sub" x="970" y="470" text-anchor="middle">.lean-receipts/ · its own .git/</text>
  </g>

  <text class="note" x="600" y="530" text-anchor="middle">Registry coordinates the projects; it does not contain their mathematics or proof evidence.</text>

  <!-- Publication path -->
  <text class="section" x="600" y="570" text-anchor="middle">When one project is ready to publish</text>

  <!-- paper-a is the illustrative project chosen for publication -->
  <path class="arrow pub" d="M 230 500 C 230 540, 165 552, 165 590"/>

  <rect class="public" x="60" y="592" width="210" height="82" rx="10"/>
  <text class="label" x="165" y="620" text-anchor="middle">Public snapshot</text>
  <text class="sub" x="165" y="643" text-anchor="middle">exact pinned commit</text>
  <text class="sub" x="165" y="661" text-anchor="middle">source + evidence available</text>

  <path class="arrow plan" d="M 272 633 H 312"/>
  <rect class="planned" x="314" y="592" width="170" height="82" rx="10"/>
  <text class="darkb" x="399" y="620" text-anchor="middle">index submit</text>
  <text class="small" x="399" y="642" text-anchor="middle">planned convenience</text>
  <text class="small" x="399" y="660" text-anchor="middle">opens contribution PR</text>

  <path class="arrow pub" d="M 486 633 H 526"/>
  <rect class="review" x="528" y="592" width="230" height="82" rx="10"/>
  <text class="darkb" x="643" y="620" text-anchor="middle">Index PR review</text>
  <text class="small" x="643" y="642" text-anchor="middle">index check --clone</text>
  <text class="small" x="643" y="660" text-anchor="middle">+ human fidelity review</text>

  <path class="arrow pub" d="M 760 633 H 802"/>
  <rect class="index" x="804" y="592" width="330" height="82" rx="10"/>
  <text class="darkb" x="969" y="620" text-anchor="middle">lean-pkg public index</text>
  <text class="small" x="969" y="642" text-anchor="middle">merged trust-graded certificate entry</text>
  <text class="small" x="969" y="660" text-anchor="middle">Palomar / Reservoir links when available</text>

  <text class="note" x="600" y="704" text-anchor="middle">solid: current architecture · dashed orange: planned convenience · public index remains separate from the private registry</text>
</svg>