<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1310" width="720" height="1310" role="img" aria-labelledby="t d">
  <title id="t">lean-pkg workflow, paper and library tracks</title>
  <desc id="d">One workflow, two products. lean-pkg new scaffolds a package; the path then forks by the kind in coverage.yaml: Track P, a verified paper (anchor the manuscript, a row per numbered result, Not formalized), or Track L, a reusable library (Main results, no manuscript). Both rejoin the shared core, the seven steps of the sample workflow: steps 1 and 2 feed the lower-tier receipt; steps 3 and 4 feed the comparator receipt; step 5 gates on both; step 6 commits the evidence; the page renders either kind; step 7 is the dry run before the one-way flip. After it the path forks again: a paper gets Reservoir, a Zenodo DOI and Palomar and is cited in the paper; a library gets a version tag, a Reservoir listing and Mathlib pull requests.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .core { fill: #f2f7f9; stroke: #0a4a63; stroke-width: 1.5; }
      .box { fill: #1a6680; stroke: #0a4a63; stroke-width: 2; }
      .box.think { fill: #b45309; stroke: #7c2d12; }
      .box.oneway { fill: #7c2d12; stroke: #431407; }
      .box.tp { fill: #5b3f8c; stroke: #3b2463; }
      .box.tl { fill: #2f6b3a; stroke: #1c4524; }
      .box.eco { fill: #f4f1ea; stroke-width: 2; stroke-dasharray: 6 4; }
      .box.eco.tp { stroke: #5b3f8c; }
      .box.eco.tl { stroke: #2f6b3a; }
      text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
      .lbl { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 12.5px; fill: #f1f5f8; }
      .num { font-size: 13px; font-weight: 700; fill: #0a4a63; }
      .coret { font-size: 14px; font-weight: 700; fill: #0a4a63; }
      .ecot { font-size: 14px; font-weight: 700; }
      .ecot.tp { fill: #4a2f78; }
      .ecot.tl { fill: #22562d; }
      .ecol { font-size: 13px; fill: #1f2a33; }
      .note { font-size: 13px; font-style: italic; fill: #5b6873; }
      .arrow { stroke: #7a8893; stroke-width: 2; fill: none; marker-end: url(#head); }
      .head { fill: #7a8893; }
      .receipt { fill: #fff8e1; stroke: #b45309; stroke-width: 1.5; }
      .rlbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #92400e; }
      .rlbl.t { font-weight: 700; }
      .badge { fill: #ffffff; stroke: #0a4a63; stroke-width: 2; }
    </style>
    <marker id="head" viewBox="0 0 11 9" refX="0" refY="4.5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto">
      <path class="head" d="M 0 0 L 11 4.5 L 0 9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="1310" rx="12"/>

  <!-- start: one scaffold for both tracks -->
  <g>
    <rect class="box" x="170" y="20" width="380" height="76" rx="10"/>
    <text class="lbl" x="360" y="46" text-anchor="middle">start: lean-pkg new NAME</text>
    <text class="sub" x="360" y="68" text-anchor="middle">scaffolds the package · no registry, no network</text>
    <text class="sub" x="360" y="86" text-anchor="middle">1.0 adds --kind paper|library (not yet shipped)</text>
  </g>

  <!-- fork: what the page is anchored to -->
  <path class="arrow" d="M 330 96 C 330 116, 190 106, 190 127"/>
  <path class="arrow" d="M 390 96 C 390 116, 530 106, 530 127"/>
  <g>
    <rect class="box tp" x="40" y="138" width="300" height="112" rx="10"/>
    <text class="lbl" x="190" y="164" text-anchor="middle">Track P · a verified paper</text>
    <text class="sub" x="190" y="188" text-anchor="middle">formalization anchor --arxiv IDvN</text>
    <text class="sub" x="190" y="208" text-anchor="middle">coverage kind: paper · one row per</text>
    <text class="sub" x="190" y="228" text-anchor="middle">numbered result · Not formalized</text>
  </g>
  <g>
    <rect class="box tl" x="380" y="138" width="300" height="112" rx="10"/>
    <text class="lbl" x="530" y="164" text-anchor="middle">Track L · a reusable library</text>
    <text class="sub" x="530" y="188" text-anchor="middle">coverage kind: library</text>
    <text class="sub" x="530" y="208" text-anchor="middle">Main results, named by their</text>
    <text class="sub" x="530" y="228" text-anchor="middle">Lean declarations · no manuscript</text>
  </g>

  <!-- rejoin: the shared core, drawn once -->
  <path class="arrow" d="M 190 250 C 190 270, 340 258, 340 279"/>
  <path class="arrow" d="M 530 250 C 530 270, 380 258, 380 279"/>
  <rect class="core" x="24" y="290" width="672" height="744" rx="12"/>
  <text class="coret" x="360" y="314" text-anchor="middle">shared core · both tracks, every step drawn once</text>
  <text class="note" x="360" y="334" text-anchor="middle">1.0: verify NAME will run steps 2, 4 and 5 (not yet shipped)</text>

  <!-- row a: the lower-tier evidence track -->
  <g>
    <rect class="box" x="44" y="352" width="200" height="76" rx="10"/>
    <circle class="badge" cx="48" cy="356" r="14"/><text class="num" x="48" y="361" text-anchor="middle">1</text>
    <text class="lbl" x="144" y="382" text-anchor="middle">register + claim</text>
    <text class="sub" x="144" y="406" text-anchor="middle">lean-pkg register / claim</text>
  </g>
  <path class="arrow" d="M 244 390 H 255"/>
  <g>
    <rect class="box" x="266" y="352" width="210" height="76" rx="10"/>
    <circle class="badge" cx="270" cy="356" r="14"/><text class="num" x="270" y="361" text-anchor="middle">2</text>
    <text class="lbl" x="371" y="376" text-anchor="middle">prove · build · audit</text>
    <text class="sub" x="371" y="398" text-anchor="middle">lake build · sorry scan</text>
    <text class="sub" x="371" y="416" text-anchor="middle">#print axioms</text>
  </g>
  <path class="arrow" d="M 476 390 H 487"/>
  <g>
    <rect class="receipt" x="498" y="352" width="178" height="76" rx="6"/>
    <text class="rlbl t" x="587" y="376" text-anchor="middle">lower-tier receipt</text>
    <text class="rlbl" x="587" y="398" text-anchor="middle">commit · toolchain</text>
    <text class="rlbl" x="587" y="416" text-anchor="middle">axioms</text>
  </g>

  <!-- row b: the comparator evidence track -->
  <g>
    <rect class="box think" x="44" y="458" width="200" height="88" rx="10"/>
    <circle class="badge" cx="48" cy="462" r="14"/><text class="num" x="48" y="467" text-anchor="middle">3</text>
    <text class="lbl" x="144" y="482" text-anchor="middle">state the claim</text>
    <text class="sub" x="144" y="504" text-anchor="middle">Challenge.lean</text>
    <text class="sub" x="144" y="520" text-anchor="middle">Solution.lean</text>
    <text class="sub" x="144" y="536" text-anchor="middle">comparator config</text>
  </g>
  <path class="arrow" d="M 244 500 H 255"/>
  <g>
    <rect class="box" x="266" y="462" width="210" height="76" rx="10"/>
    <circle class="badge" cx="270" cy="466" r="14"/><text class="num" x="270" y="471" text-anchor="middle">4</text>
    <text class="lbl" x="371" y="486" text-anchor="middle">comparator-receipt</text>
    <text class="sub" x="371" y="508" text-anchor="middle">independent kernel replay</text>
    <text class="sub" x="371" y="526" text-anchor="middle">writes only on PASS</text>
  </g>
  <path class="arrow" d="M 476 500 H 487"/>
  <g>
    <rect class="receipt" x="498" y="462" width="178" height="76" rx="6"/>
    <text class="rlbl t" x="587" y="486" text-anchor="middle">comparator receipt</text>
    <text class="rlbl" x="587" y="508" text-anchor="middle">config sha · log sha</text>
    <text class="rlbl" x="587" y="526" text-anchor="middle">PASS</text>
  </g>
  <text class="note" x="44" y="566">step 3 is the only step that takes real thought: every notion</text>
  <text class="note" x="44" y="584">restated from Mathlib so a reader needs no trust in your library</text>

  <!-- gate: both receipts enter from the right -->
  <path class="arrow" d="M 676 390 H 686 V 664 H 503"/>
  <path class="arrow" d="M 640 538 V 624 H 503"/>
  <g>
    <rect class="box" x="230" y="604" width="262" height="100" rx="10"/>
    <circle class="badge" cx="234" cy="608" r="14"/><text class="num" x="234" y="613" text-anchor="middle">5</text>
    <text class="lbl" x="361" y="630" text-anchor="middle">gate</text>
    <text class="sub" x="361" y="652" text-anchor="middle">both receipts re-derived</text>
    <text class="sub" x="361" y="670" text-anchor="middle">from bytes</text>
    <text class="sub" x="361" y="688" text-anchor="middle">→ verified-private</text>
  </g>
  <path class="arrow" d="M 361 704 V 721"/>

  <!-- commit the evidence, render the page, promote -->
  <g>
    <rect class="box" x="230" y="732" width="262" height="76" rx="10"/>
    <circle class="badge" cx="234" cy="736" r="14"/><text class="num" x="234" y="741" text-anchor="middle">6</text>
    <text class="lbl" x="361" y="756" text-anchor="middle">commit the evidence</text>
    <text class="sub" x="361" y="778" text-anchor="middle">.lean-receipts/ only</text>
    <text class="sub" x="361" y="796" text-anchor="middle">→ still valid</text>
  </g>
  <path class="arrow" d="M 361 808 V 825"/>
  <g>
    <rect class="box" x="230" y="836" width="262" height="76" rx="10"/>
    <text class="lbl" x="361" y="860" text-anchor="middle">verification page</text>
    <text class="sub" x="361" y="882" text-anchor="middle">page NAME --write · --check</text>
    <text class="sub" x="361" y="900" text-anchor="middle">paper rows, or Main results</text>
  </g>
  <path class="arrow" d="M 361 912 V 929"/>
  <g>
    <rect class="box oneway" x="230" y="940" width="262" height="76" rx="10"/>
    <circle class="badge" cx="234" cy="944" r="14"/><text class="num" x="234" y="949" text-anchor="middle">7</text>
    <text class="lbl" x="361" y="964" text-anchor="middle">promote (dry run)</text>
    <text class="sub" x="361" y="986" text-anchor="middle">read every line · --yes is one-way</text>
    <text class="sub" x="361" y="1004" text-anchor="middle">1.0: publish NAME --yes</text>
  </g>

  <!-- after the flip: the ecosystem takes over, by track -->
  <path class="arrow" d="M 331 1016 C 331 1044, 190 1036, 190 1057"/>
  <path class="arrow" d="M 391 1016 C 391 1044, 530 1036, 530 1057"/>
  <g>
    <rect class="box eco tp" x="40" y="1068" width="300" height="140" rx="10"/>
    <text class="ecot tp" x="190" y="1094" text-anchor="middle">Track P · after --yes</text>
    <text class="ecol" x="190" y="1116" text-anchor="middle">Reservoir (listing, automatic)</text>
    <text class="ecol" x="190" y="1135" text-anchor="middle">Palomar (the headline theorem)</text>
    <text class="ecol" x="190" y="1154" text-anchor="middle">Zenodo (version DOI at the</text>
    <text class="ecol" x="190" y="1172" text-anchor="middle">registered commit)</text>
    <text class="ecol" x="190" y="1192" text-anchor="middle">cite DOI + Palomar id in the paper</text>
  </g>
  <g>
    <rect class="box eco tl" x="380" y="1068" width="300" height="140" rx="10"/>
    <text class="ecot tl" x="530" y="1094" text-anchor="middle">Track L · after --yes</text>
    <text class="ecol" x="530" y="1116" text-anchor="middle">tag vX.Y.Z = lakefile version</text>
    <text class="ecol" x="530" y="1135" text-anchor="middle">Reservoir listing (reservoir check)</text>
    <text class="ecol" x="530" y="1154" text-anchor="middle">Mathlib PRs, then upstreamed;</text>
    <text class="ecol" x="530" y="1172" text-anchor="middle">or a standalone public package</text>
  </g>

  <text class="note" x="40" y="1238">purple: Track P only · green: Track L only · blue: shared</text>
  <text class="note" x="40" y="1256">orange: human judgment · dark red: irreversible</text>
  <text class="note" x="40" y="1274">dashed: outside lean-pkg · numbers: sample workflow steps</text>
  <text class="note" x="40" y="1292">receipts are plain JSON files committed next to the code</text>
</svg>
