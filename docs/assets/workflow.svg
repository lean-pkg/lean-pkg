<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" width="1120" height="490" role="img" aria-labelledby="t d">
  <title id="t">lean-pkg sample workflow</title>
  <desc id="d">Seven steps from registering a package to the promotion dry run. Steps 1 and 2 feed the lower-tier receipt; steps 3 and 4 feed the comparator receipt; step 5 gates on both; step 6 commits the evidence; step 7 is the dry run before the one-way flip, after which Reservoir, Palomar and Zenodo take over.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #1a6680; stroke: #0a4a63; stroke-width: 2; }
      .box.think { fill: #b45309; stroke: #7c2d12; }
      .box.oneway { fill: #7c2d12; stroke: #431407; }
      .box.eco { fill: #f4f1ea; stroke: #0a4a63; stroke-width: 2; stroke-dasharray: 6 4; }
      text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; }
      .lbl { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .sub { font-size: 12.5px; fill: #f1f5f8; }
      .num { font-size: 13px; font-weight: 700; fill: #0a4a63; }
      .ecot { font-size: 14px; font-weight: 700; fill: #0a4a63; }
      .ecol { font-size: 13px; fill: #0a4a63; }
      .note { font-size: 13px; font-style: italic; fill: #5b6873; }
      .arrow { stroke: #6b7a85; stroke-width: 2.5; fill: none; marker-end: url(#head); }
      .head { fill: #6b7a85; }
      .receipt { fill: #fff8e1; stroke: #b45309; stroke-width: 1.5; }
      .rlbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #92400e; }
      .rlbl.t { font-weight: 700; }
      .badge { fill: #ffffff; stroke: #0a4a63; stroke-width: 2; }
    </style>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="490" rx="12"/>

  <!-- row 1: the lower-tier evidence track -->
  <g>
    <circle class="badge" cx="24" cy="78" r="14"/><text class="num" x="24" y="83" text-anchor="middle">1</text>
    <rect class="box" x="46" y="40" width="230" height="76" rx="10"/>
    <text class="lbl" x="161" y="70" text-anchor="middle">register + claim</text>
    <text class="sub" x="161" y="94" text-anchor="middle">lean-pkg register / claim</text>
  </g>
  <path class="arrow" d="M 278 78 H 302"/>
  <g>
    <circle class="badge" cx="318" cy="78" r="14"/><text class="num" x="318" y="83" text-anchor="middle">2</text>
    <rect class="box" x="340" y="40" width="250" height="76" rx="10"/>
    <text class="lbl" x="465" y="64" text-anchor="middle">prove · build · audit</text>
    <text class="sub" x="465" y="86" text-anchor="middle">lake build · sorry scan</text>
    <text class="sub" x="465" y="104" text-anchor="middle">#print axioms</text>
  </g>
  <path class="arrow" d="M 592 78 H 622"/>
  <g>
    <rect class="receipt" x="624" y="40" width="200" height="76" rx="6"/>
    <text class="rlbl t" x="724" y="64" text-anchor="middle">lower-tier receipt</text>
    <text class="rlbl" x="724" y="86" text-anchor="middle">commit · toolchain</text>
    <text class="rlbl" x="724" y="104" text-anchor="middle">axioms</text>
  </g>

  <!-- row 2: the comparator evidence track -->
  <g>
    <circle class="badge" cx="24" cy="198" r="14"/><text class="num" x="24" y="203" text-anchor="middle">3</text>
    <rect class="box think" x="46" y="160" width="230" height="76" rx="10"/>
    <text class="lbl" x="161" y="184" text-anchor="middle">state the claim</text>
    <text class="sub" x="161" y="206" text-anchor="middle">Challenge.lean · Solution.lean</text>
    <text class="sub" x="161" y="224" text-anchor="middle">· comparator config</text>
  </g>
  <path class="arrow" d="M 278 198 H 302"/>
  <g>
    <circle class="badge" cx="318" cy="198" r="14"/><text class="num" x="318" y="203" text-anchor="middle">4</text>
    <rect class="box" x="340" y="160" width="250" height="76" rx="10"/>
    <text class="lbl" x="465" y="184" text-anchor="middle">comparator-receipt</text>
    <text class="sub" x="465" y="206" text-anchor="middle">independent kernel replay</text>
    <text class="sub" x="465" y="224" text-anchor="middle">writes only on PASS</text>
  </g>
  <path class="arrow" d="M 592 198 H 622"/>
  <g>
    <rect class="receipt" x="624" y="160" width="200" height="76" rx="6"/>
    <text class="rlbl t" x="724" y="184" text-anchor="middle">comparator receipt</text>
    <text class="rlbl" x="724" y="206" text-anchor="middle">config sha · log sha</text>
    <text class="rlbl" x="724" y="224" text-anchor="middle">PASS</text>
  </g>
  <text class="note" x="46" y="264">step 3 is the only step that takes real thought: every notion restated from Mathlib</text>
  <text class="note" x="46" y="282">so a reader needs no trust in your library</text>

  <!-- gate -->
  <path class="arrow" d="M 826 78 C 854 78, 850 112, 878 112"/>
  <path class="arrow" d="M 826 198 C 854 198, 850 164, 878 164"/>
  <g>
    <circle class="badge" cx="858" cy="138" r="14"/><text class="num" x="858" y="143" text-anchor="middle">5</text>
    <rect class="box" x="880" y="88" width="220" height="100" rx="10"/>
    <text class="lbl" x="990" y="114" text-anchor="middle">gate</text>
    <text class="sub" x="990" y="136" text-anchor="middle">both receipts re-derived</text>
    <text class="sub" x="990" y="154" text-anchor="middle">from bytes</text>
    <text class="sub" x="990" y="172" text-anchor="middle">→ verified-private</text>
  </g>
  <path class="arrow" d="M 990 190 V 228"/>

  <!-- row 3: commit evidence, promote -->
  <g>
    <circle class="badge" cx="858" cy="268" r="14"/><text class="num" x="858" y="273" text-anchor="middle">6</text>
    <rect class="box" x="880" y="230" width="220" height="76" rx="10"/>
    <text class="lbl" x="990" y="254" text-anchor="middle">commit the evidence</text>
    <text class="sub" x="990" y="276" text-anchor="middle">.lean-receipts/ only</text>
    <text class="sub" x="990" y="294" text-anchor="middle">→ still valid</text>
  </g>
  <path class="arrow" d="M 990 308 V 338"/>
  <g>
    <circle class="badge" cx="858" cy="378" r="14"/><text class="num" x="858" y="383" text-anchor="middle">7</text>
    <rect class="box oneway" x="880" y="340" width="220" height="76" rx="10"/>
    <text class="lbl" x="990" y="364" text-anchor="middle">promote (dry run)</text>
    <text class="sub" x="990" y="386" text-anchor="middle">read every line</text>
    <text class="sub" x="990" y="404" text-anchor="middle">--yes is one-way</text>
  </g>

  <!-- ecosystem after the flip -->
  <path class="arrow" d="M 842 378 H 808"/>
  <g>
    <rect class="box eco" x="46" y="336" width="760" height="84" rx="10"/>
    <text class="ecot" x="426" y="362" text-anchor="middle">after --yes, the ecosystem takes over</text>
    <text class="ecol" x="426" y="384" text-anchor="middle">Reservoir (listing, automatic) · Palomar (register the headline theorem)</text>
    <text class="ecol" x="426" y="404" text-anchor="middle">Zenodo (version DOI at the registered commit)</text>
  </g>
  <text class="note" x="46" y="456">orange: human judgment · dark red: irreversible · dashed: outside lean-pkg</text>
  <text class="note" x="46" y="474">receipts are plain JSON files committed next to the code</text>
</svg>
