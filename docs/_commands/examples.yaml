# Examples for the command reference (docs/commands/), keyed by command path: the program, then the
# command words, aliases resolved ("lean-pkg claims sync", "lean-pkg comparator host-check",
# "lean-pkg receipt comparator"). Each example: cmd (one invocation, no pipes or redirections; a trailing
# backslash continues the line), say (one sentence), output (optional sample output).
#
# tests/test_command_docs.py parses every cmd with the real parser and checks that it runs the command
# it is filed under: renaming a command or a flag fails the test until the example is fixed. Commands
# without an example are listed as a warning (`python3 scripts/command_docs.py --missing`).
# The package name `my-proof` and the paths are placeholders.

# --- set up -----------------------------------------------------------------------------------------

lean-pkg new:
  - cmd: lean-pkg new my-paper-lean
    say: Scaffold a companion to a paper (kind paper, the default; library MyPaperLean, Mathlib) in ./my-paper-lean and git init it; its coverage.yaml waits for the paper's title and rows, then `formalization anchor`.
    output: |
      created my-paper-lean/: package my-paper-lean (kind paper), library MyPaperLean, v4.35.0-rc2, Mathlib v4.35.0-rc2; 15 files, git initialized, nothing committed, no registry read or written
  - cmd: lean-pkg new my-proof --kind library
    say: Scaffold a library (its coverage.yaml lists the example as the main result); the quickstart takes it from there.
  - cmd: lean-pkg new my-proof --kind library --no-mathlib --author "Ada Lovelace" --license MIT
    say: The same in core Lean, with the author and the license named.

lean-pkg registry init:
  - cmd: lean-pkg registry init
    say: Create the registry and its event log once, at the default location (~/.lean-pkg/registry, or $LEAN_PKG_REGISTRY).
    output: |
      registry created: ~/.lean-pkg/registry/lean-packages.yaml (version 3); events: ~/.lean-pkg/registry/lean-package-events.jsonl
  - cmd: lean-pkg --registry ~/.lean-pkg/registry/lean-packages.yaml registry init
    say: The same with the registry file named explicitly; the global --registry flag goes before the command.

lean-pkg verify:
  - cmd: lean-pkg verify my-proof --dry-run
    say: Run the read-only preflight (claims.yaml and coverage.yaml at HEAD), then print the three steps (the comparator receipt, the lower-tier receipt at the same commit, the gate) and their exact commands; nothing else runs.
  - cmd: lean-pkg verify my-proof
    say: Run them in that order at the checkout's HEAD; an active package first moves to gate-pending, a gated one is re-gated. Commit the receipts afterwards.
    output: |
      verify: 0/3 preflight: claims and coverage files committed at a0a4fe68e46c
        PASS claims.yaml at a0a4fe68e46c: schema ok (1 claim(s))
        ...
      verify: 1/3 comparator receipt: lean-pkg receipt comparator --repo .../my-proof
      ...
      verify my-proof: verified-private at a0a4fe68e46c: lower-tier .lean-receipts/a0a4fe68e46c-systemd-user-my-proof-verify.service-<id>-h-<label>.json, comparator .lean-receipts/a0a4fe68e46c-comparator.json
      next:
        git -C .../my-proof add .lean-receipts && git -C .../my-proof commit -m "evidence: receipts at a0a4fe68e46c"
        lean-pkg page my-proof --write

lean-pkg doctor:
  - cmd: lean-pkg doctor
    say: Check the installation, the registry, the index and the tools in one line each; exit 1 when the registry is unreadable or its schema version is unsupported.
  - cmd: lean-pkg doctor --package my-proof
    say: Also compare the lean-pkg that wrote each of the package's gate receipts with the running one; a warn line names the breaking changes in between and the `doctor --upgrade-from` command to read. Never an exit 1.

lean-pkg help:
  - cmd: lean-pkg help
    say: List the commands and the help topics.
  - cmd: lean-pkg help exit-codes
    say: Print the exit codes and what exit 1 means for each command that answers yes or no.
  - cmd: lean-pkg help gate
    say: Print exactly the text of `lean-pkg gate --help`.

lean-pkg llms:
  - cmd: lean-pkg llms
    say: Print the agent contract (standing rules, status transitions, every subcommand, receipt and event schemas, exit codes), the text llms.txt carries below its header.
    output: |
      lean-pkg llms.txt — agent contract for the Lean 4 package registry

      PURPOSE
      ...
  - cmd: lean-pkg llms --short
    say: A compact contract of about 40 lines cut from the full text by its section headers (purpose, standing rules, the first line of each subcommand).
  - cmd: lean-pkg llms --json
    say: The contract as JSON, an object whose `text` holds the full contract.

lean-pkg report:
  - cmd: lean-pkg report --command "status my-proof" --package my-proof
    say: Assemble a redacted bug report (version, doctor and host-check lines, the command re-run with its output, the package's record) and print it; a dry run by default that files nothing.
    output: |
      title: report: lean-pkg status my-proof
      labels: bug
      repository: lean-pkg/lean-pkg
      redactions: 15
      ---
      ...
  - cmd: lean-pkg report --from-log logs/build.log:100 --body "lake build hangs at Mathlib.Order" --yes
    say: File it on lean-pkg/lean-pkg with `gh issue create` and print the issue URL; refused with exit 1 when gh is missing or not logged in (a blocking private-pattern hit left after redaction refuses in either mode).

# --- see the registry -------------------------------------------------------------------------------

lean-pkg list:
  - cmd: lean-pkg list
    say: One line per package, for a terminal or a pipe.
    output: |
      NAME      STATUS  VIS      LEASE  EXPIRES  PIN  REAUDIT
      my-proof  active  private  -      -        -    -
  - cmd: lean-pkg list --json --only my-proof --fields status
    say: One value of one package, as JSON for a script.

lean-pkg status:
  - cmd: lean-pkg status my-proof
    say: The full record, the last five history entries and the scope (gated commit, privacy, the comparator-covered declarations).
  - cmd: lean-pkg status my-proof --fields status,lease.agent
    say: Only these keys; dotted paths reach into the lease and the gate.
    output: |
      my-proof:
        status: active
        lease:
          agent: alice

lean-pkg next:
  - cmd: lean-pkg next my-proof
    say: The single command to run now for this package, with a one-line reason; exit 1 when it is blocked.
    output: |
      my-proof (active): lean-pkg lease claim my-proof --workspace W --agent A --reason "..."
        why: status active and no live lease: claim the package before working on it
  - cmd: lean-pkg next my-proof --json
    say: The same as JSON (`command`, `reason`, `blockers`, `state`) for an agent or a script.

lean-pkg lease list:
  - cmd: lean-pkg lease list --agent alice --expiring 2
    say: Your own leases that lapse within two hours, the ones to renew.

lean-pkg registry validate:
  - cmd: lean-pkg registry validate
    say: Schema, enum and history sanity of the whole registry; exit 0 valid, 1 errors.

lean-pkg registry audit:
  - cmd: lean-pkg registry audit
    say: Report expired leases, receipt and comparator drift and visibility mismatches; read-only.
  - cmd: lean-pkg registry audit --write
    say: Clear expired leases and copy GitHub's visibility and archived flag into the registry.

lean-pkg registry board:
  - cmd: lean-pkg registry board
    say: Show every package's status, visibility, lease, pin and re-audit date, as a curses TUI on a terminal (whose keys can claim, release and gate) and otherwise as a static, read-only table.
    output: |
      NAME      STATUS  VIS      LEASE  EXPIRES  PIN  REAUDIT
      my-proof  active  private  -      -        -    -
  - cmd: lean-pkg registry board --only my-proof --fields status,lease.agent
    say: Only the named packages, each cut to the named keys (the same dotted paths and aliases as `status --fields`) and printed as YAML; never opens the TUI, and an unknown package exits 1.
    output: |
      my-proof:
        status: active
        lease:
          agent: null
  - cmd: lean-pkg registry board --no-claims --json
    say: The whole registry as JSON for scripts, with the bulk `claims` key dropped from each record and its name listed under `omitted`.

lean-pkg registry migrate:
  - cmd: lean-pkg registry migrate --dry-run
    say: Print what upgrading the registry schema to version 3 would add (the v2 and v3 fields with their defaults, and any legacy `~/` `local_path` rewritten to its $HOME-relative form); nothing is written.
    output: |
      registry already at version 3; nothing to do
  - cmd: lean-pkg registry migrate
    say: Apply that upgrade in place, additively and idempotently, and record a registry-migrated event.

lean-pkg registry wiki:
  - cmd: lean-pkg registry wiki
    say: Render a Markdown status page (packages, active leases, third-party adoptions) from the registry to stdout; read-only.
    output: |
      ---
      title: Lean Verification Status
      type: lean-verification
      updated: '2026-10-25'
      ---
      ...
      | name | status | visibility | lease | mathlib pin | reaudit_after |
      |---|---|---|---|---|---|
      | my-proof | active | private | - | - | - |
      ...
  - cmd: lean-pkg registry wiki --out docs/lean-status.md --candidates ~/.lean-pkg/registry/lean-adoption-candidates.yaml
    say: Write the page to a file instead of stdout, reading the adoption ledger from the given path (default lean-adoption-candidates.yaml next to the registry).

lean-pkg search:
  - cmd: lean-pkg search "heat mass" --package my-proof
    say: Search for prior art in the registry, the index, Loogle, LeanSearch, Reservoir, Palomar and GitHub, in that order (Loogle only for a declaration pattern), with each source marked ok or skipped; exit 0 even with zero hits.
  - cmd: lean-pkg search "heat mass" --offline
    say: Skip every network source; as always, packages without synced claims are searched by declaration, and the incomplete line says a zero is not a negative result (add --require-complete to exit 1 then).
    output: |
      lean-pkg search "heat mass" on 2026-10-25
      registry: ok at sha256:fff31473c971, 1 hit
        [1 name] my-proof: heat_mass_le  (theorem, declaration (unclaimed), trust none, MyProof/Basic.lean:1)
            theorem heat_mass_le : True := trivial
      index: skipped: no index directory
      loogle: skipped: offline
      leansearch: skipped: offline
      reservoir: skipped: offline
      palomar: skipped: offline
      github: skipped: offline
      registry coverage: 1 of 1 packages have no synced claims: 1 searched by declaration only, 0 not searched (no checkout)
      incomplete: searched 1 of 7 sources; skipped: index, loogle, leansearch, reservoir, palomar, github; a zero here is not a negative result
      consulted: registry (ok, 1 hit), index (skipped: no index directory), loogle (skipped: offline), leansearch (skipped: offline), reservoir (skipped: offline), palomar (skipped: offline), github (skipped: offline)
  - cmd: lean-pkg search heat_mass_le --package my-proof --record
    say: Also write docs/prior-art/<date>-<slug>.md (decision pending) in the package's checkout and a prior-art-searched event; edit the page, then commit it in that repository.

# --- register, lease, edit --------------------------------------------------------------------------

lean-pkg register:
  - cmd: lean-pkg register my-proof --url git@github.com:you/my-proof.git --path src/my-proof --license-spdx Apache-2.0 --dry-run
    say: Print the entry that would be written, detected toolchain and Mathlib pin included; nothing is written.
  - cmd: lean-pkg register my-proof --url git@github.com:you/my-proof.git --path src/my-proof
    say: Register a new package from its checkout (the path is relative to $HOME); it starts at status active.
    output: |
      my-proof: registered (status=active, visibility=private, toolchain=leanprover/lean4:v4.24.0, pin=?)

lean-pkg lease claim:
  - cmd: lean-pkg lease claim my-proof --workspace laptop --agent alice --reason "chapter 2"
    say: Take the 24-hour lease before working on the package, so other agents see who holds it.
    output: |
      my-proof: lease claimed for alice@laptop until 2026-10-18T14:24:32+00:00
  - cmd: lean-pkg lease claim my-proof --workspace laptop --agent alice --contact lab-desk/my-session
    say: The same, with an address where others can reach the holding session.

lean-pkg lease renew:
  - cmd: lean-pkg lease renew my-proof --agent alice
    say: Restart your own live lease from now; once it has lapsed, claim again.

lean-pkg lease release:
  - cmd: lean-pkg lease release my-proof --agent alice
    say: Give the lease back when you are done.
    output: |
      my-proof: lease released (was alice@laptop)

lean-pkg repo export:
  - cmd: lean-pkg repo export my-proof ../my-proof-public --dry-run
    say: Plan a fresh single-commit public repository from the gated tree; nothing is written.
  - cmd: "lean-pkg repo export my-proof ../my-proof-public --author 'Ada <12345+ada@users.noreply.github.com>'"
    say: Name the export commit's author and committer (a GitHub noreply address); without it the source repository's local git config supplies them, never your global identity.

lean-pkg repo adopt:
  - cmd: lean-pkg repo adopt my-proof ../my-proof-public
    say: Adopt an existing repository, already the intended public one, as the package's repository.

lean-pkg update:
  - cmd: lean-pkg update my-proof --license-spdx Apache-2.0
    say: Set a field of a registered package (register is only for new ones).

lean-pkg record:
  - cmd: lean-pkg record my-proof consent-recorded --field who=ada --field role=author --field pointer=https://example.org/consent
    say: Append a publication evidence event with its required fields to the package's history and the matching record field; the same who, role and pointer again is a no-op with exit 0.
    output: |
      my-proof: consent-recorded recorded
  - cmd: lean-pkg record my-proof doi-minted --field doi=10.5281/zenodo.1234567 --field tag=v1.0.0 --field commit=<40hex>
    say: Record a minted DOI; refused with exit 1 and nothing written (rule doi-in-palomar) unless a palomar-* event already recorded that commit or the package is public on the doi-only track.
  - cmd: lean-pkg record my-proof retract --field event=doi-minted --field ts=<timestamp> --reason "wrong commit"
    say: Mark an earlier evidence entry retracted, append-only (event evidence-retracted), so validate and the upstreamed check ignore it.

lean-pkg repo move:
  - cmd: lean-pkg repo move my-proof work/my-proof-2 --reason "checkout moved" --dry-run
    say: Show what pointing the record at another $HOME-relative checkout would clear (gate receipts and cached claims not bound to the new HEAD) and the next commands; nothing is written.
    output: |
      my-proof: relocated work/my-proof -> work/my-proof-2
        note: lean_toolchain/mathlib_pin left as recorded; run `lean-pkg update my-proof --redetect` to re-read toolchain/pin
      DRY RUN — nothing written. Re-run without --dry-run to relocate.
      binding at the new path (HEAD 52c57490bfd1):
        no gate receipt recorded
        formalization.yaml (pointer not recorded): not applicable
      next: nothing to re-gate
  - cmd: lean-pkg repo move my-proof work/my-proof-2 --reason "checkout moved"
    say: Relocate it, keeping name and history (and the claims cache only when it was synced at the new HEAD) and recording a relocated event (a verified-private package whose receipt is cleared drops to gate-pending); without --reason it exits 1.

# --- evidence ---------------------------------------------------------------------------------------

lean-pkg receipt slurm:
  - cmd: lean-pkg receipt slurm --template
    say: Print a minimal sbatch wrapper whose files pass every check; save it as verify.sbatch and edit its commands.
  - cmd: |
      lean-pkg receipt slurm --check --commit "$(git rev-parse HEAD)" --log verify-123.log \
        --stdout verify-123.out --stderr verify-123.err
    say: Preflight the files of a finished job before writing anything; exit 1 names each problem.
  - cmd: |
      lean-pkg receipt slurm --job 123 --commit "$(git rev-parse HEAD)" --log verify-123.log \
        --stdout verify-123.out --stderr verify-123.err --append-readme
    say: Write the lower-tier receipt under .lean-receipts/ in the checkout and add its entry block to the README there.

lean-pkg receipt systemd:
  - cmd: |
      lean-pkg receipt systemd --unit audit-gate --commit "$(git rev-parse HEAD)" \
        --log gate/verify.log --stdout gate/unit.out --stderr gate/unit.err \
        --checker "gate.sh (lake build; #print axioms)" --run -- bash gate.sh gate/verify.log
    say: Run a light verify script locally in a capped systemd --user unit and write the same lower-tier receipt as receipt slurm.

lean-pkg receipt ci:
  - cmd: lean-pkg receipt ci --template
    say: Print the caller workflow that runs lean-pkg's reusable verify.yml on a GitHub-hosted runner; commit it as .github/workflows/lean-pkg.yml.
  - cmd: lean-pkg receipt ci --log "$RUNNER_TEMP/lean-pkg/verify.log" --repo .
    say: Inside the job (verify.yml's last step), write the receipt gha-<run>-<attempt> with its ci block from the runner's variables; refused outside GitHub Actions.
  - cmd: lean-pkg receipt ci --collect 11622958301 --attempt 1
    say: On your machine, download the run's receipt artifact with gh, check it as gate --check does and copy it into .lean-receipts/; nothing is committed or pushed.

lean-pkg receipt check:
  - cmd: lean-pkg receipt check --repo . --commit 0123456789abcdef0123456789abcdef01234567
    say: In a fresh clone of a published package, check its receipts for the page's bound commit from git alone; no registry, no network, no Lean run.
    output: |
      receipt check: PASS my-proof at 0123456789ab (tier comparator; 13 passed, 1 skipped)
        commit 0123456789abcdef0123456789abcdef01234567 (published ref 89abcdef0123)
        rule: evidence-only descendants (docs-only not accepted; --docs-descendants to accept them)
        ...
        PASS binding: evidence-only descendant of 0123456789ab (+3 evidence file(s))
        ...
      receipt check: PASS my-proof at 0123456789ab (tier comparator; 13 passed, 1 skipped)
  - cmd: lean-pkg receipt check --repo . --commit 0123456789abcdef0123456789abcdef01234567 --at v1.0.0
    say: At a release tag after the page commit, for a package that committed lean-pkg-binding.yaml at the bound commit; its opt-in to the docs-only rule is applied without a flag, and the binding line lists what changed.
    output: |
      receipt check: PASS my-proof at 0123456789ab (tier comparator; 14 passed, 1 skipped)
        commit 0123456789abcdef0123456789abcdef01234567 (published ref 89abcdef0123)
        rule: evidence-only or docs-only descendants (docs-only: the author's opt-in, lean-pkg-binding.yaml committed at 0123456789ab; --evidence-only to refuse them)
        ...
        PASS opt-in: lean-pkg-binding.yaml at 0123456789ab opts in to docs-only descendants (build_inputs: 0 glob(s))
        PASS binding: docs-only descendant of 0123456789ab (1 non-build file(s): README.md; opted in at 0123456789ab by lean-pkg-binding.yaml)
        ...
      receipt check: PASS my-proof at 0123456789ab (tier comparator; 14 passed, 1 skipped)
  - cmd: lean-pkg receipt check --repo . --commit 0123456789abcdef0123456789abcdef01234567 --at v1.0.0 --evidence-only --json
    say: The strict rule over the author's committed opt-in, where only an evidence-only descendant binds; every check with its verdict as JSON.
  - cmd: lean-pkg receipt check --repo . --commit 0123456789abcdef0123456789abcdef01234567 --at v1.0.0 --docs-descendants --json
    say: For a package without lean-pkg-binding.yaml, also accept a README or notes committed after the evidence (the docs-only rule, the referee's choice); every check with its verdict as JSON.
  - cmd: lean-pkg receipt check --repo . --commit 0123456789abcdef0123456789abcdef01234567 --corroborate --github OWNER/REPO
    say: Also corroborate a GitHub Actions receipt against the public run API (level 2), the package's repository named by --github; GH_TOKEN only raises the rate limit.

lean-pkg gate:
  - cmd: lean-pkg gate my-proof --receipt .lean-receipts/receipt.json --check
    say: Validate the receipt against HEAD and record nothing; exit 1 when gate would refuse it.
  - cmd: lean-pkg gate my-proof --receipt .lean-receipts/receipt.json
    say: Accept the lower-tier receipt and move the package from gate-pending to verified-private.
  - cmd: lean-pkg gate my-proof --receipt .lean-receipts/receipt.json --regate
    say: Re-gate an already verified package on a newer receipt; the status does not change.

lean-pkg receipt comparator:
  - cmd: lean-pkg receipt comparator --estimate
    say: In the package checkout, time a sample of the comparator slots first; no receipt is written.
  - cmd: lean-pkg receipt comparator
    say: In the package checkout, run the comparator over every configuration and write .lean-receipts/<commit12>-comparator.json (the `comparator-receipt` program does the same).
  - cmd: lean-pkg receipt comparator --repo src/my-proof --judges 4
    say: The same for another directory, with up to four judges at once.
  - cmd: lean-pkg receipt comparator --seal-sacct .lean-receipts/cb3d68a21454-comparator.json
    say: After the Slurm job finished, seal its sacct record into the receipt so its job can back a compute site.

lean-pkg comparator check:
  - cmd: lean-pkg comparator check my-proof --receipt .lean-receipts/cb3d68a21454-comparator.json
    say: Validate a comparator receipt against the package without recording it; works at any status.
  - cmd: lean-pkg comparator check my-proof --contracts-only
    say: Before a gate, run the compare step of every comparator configuration at once, with no kernel and no receipt; never acceptance.
    output: |
      my-proof: contracts-only diagnostic, 2 configuration(s): 1 differ, 0 error(s), 1 match (never acceptance; no kernel, no receipt)
        DIFFERS: comparator/config-lq.json: Const does not match between challenge and target 'Heat.heatLqConst'
          breadcrumb: audit_lq -> Heat.heatLqConst
          first differing field: value at body.fn.arg.fn: challenge const _private.Challenge.Ref.Lq.0.Heat.lqConstReal; solution const _private.Heat.Lq.0.Heat.lqConstReal
          hint: the same private name Heat.lqConstReal is owned by module Challenge.Ref.Lq on the Challenge side and Heat.Lq on the Solution side: a private name embeds its module, so a copy under another module never matches (see docs/comparator.md#private-helpers-and-copied-references)
        match: comparator/config-pub.json
        never acceptance: no kernel ran and nothing was written (no receipt, no registry entry, no file in the checkout); only `lake comparator` in a gate judges
      my-proof: contracts-only diagnostic, 2 configuration(s): 1 differ, 0 error(s), 1 match (never acceptance; no kernel, no receipt)

lean-pkg comparator attach:
  - cmd: lean-pkg comparator attach my-proof --receipt .lean-receipts/cb3d68a21454-comparator.json
    say: Attach the comparator receipt to the gated package (event comparator-attached); publish --yes needs it.

lean-pkg comparator host-check:
  - cmd: lean-pkg comparator host-check
    say: Can this machine produce comparator receipts? Needs no registry; exit 1 when it cannot.
  - cmd: lean-pkg comparator host-check --routes
    say: Per route (judge here, prepare here, build here and judge elsewhere), whether it is supported and why.

lean-pkg comparator config:
  - cmd: lean-pkg comparator config --from-claims my-proof --dry-run
    say: Print one comparator configuration entry per synced theorem claim that no configuration covers yet.

lean-pkg comparator coverage:
  - cmd: lean-pkg comparator coverage my-proof
    say: Which claims the comparator configuration at the gate-bound commit covers, and which it does not.

lean-pkg comparator migrate-signoff:
  - cmd: lean-pkg comparator migrate-signoff comparator.json
    say: Show how the deprecated inline judged_as keys would move into lean-pkg-signoff.json; --write writes both files.

# --- claims, coverage, page -------------------------------------------------------------------------

lean-pkg claims sync:
  - cmd: lean-pkg claims sync my-proof
    say: Read claims.yaml at HEAD of the checkout, validate it and cache the claims in the registry.

lean-pkg claims check:
  - cmd: lean-pkg claims check --file claims.yaml
    say: Schema-check a working-copy claims.yaml without the registry.

lean-pkg coverage check:
  - cmd: lean-pkg coverage check my-proof
    say: Validate coverage.yaml committed at HEAD (the paper-to-Lean map that page renders).
  - cmd: lean-pkg coverage check my-proof --file coverage.yaml
    say: Check the working copy before committing it.
  - cmd: lean-pkg coverage check --file coverage.yaml --claims claims.yaml --comparator comparator.json
    say: The offline form, before the package is registered or the files are committed; reads no registry and no receipt, and lists the checks it skipped.
    output: |
      coverage.yaml: coverage: OK; library; 1 main result(s); offline, 4 check(s) skipped
        pass: schema: coverage/1 schema and length limits
        ...
        pass: comparator theorems: each of 1 theorem(s) in 1 configuration(s) is the declaration of a claim a row names (R11)
        skipped: compute receipts: each compute job is a receipt committed under .lean-receipts/: needs the receipts at HEAD
        ...
      coverage.yaml: coverage: OK; library; 1 main result(s); offline, 4 check(s) skipped

lean-pkg blueprint check:
  - cmd: lean-pkg blueprint check my-proof
    say: Run checkdecls on blueprint/lean_decls at HEAD (after `lake build`) and check that every claim the blueprint names is a declaration checkdecls accepts.
    output: |
      my-proof: blueprint check at 0123456789ab: FAILED; 2 declaration(s) in blueprint/lean_decls, 1 missing; checkdecls 3d425859e73f
        missing: MyProof.absent_lemma
        claims: 1 claim(s) in claims.yaml name a blueprint declaration
        note: 1 blueprint declaration(s) no claim carries: MyProof.absent_lemma
  - cmd: lean-pkg blueprint check my-proof --decls docs/blueprint/lean_decls --json
    say: A blueprint kept elsewhere in the repository; the JSON lists missing[] and the claim cross-check.

lean-pkg page:
  - cmd: lean-pkg page my-proof
    say: Print the README verification section rendered from coverage.yaml, the claims, the ledger and the receipts.
  - cmd: lean-pkg page my-proof --write
    say: Replace the marked block in the package README.md (append it when absent).
  - cmd: lean-pkg page my-proof --check
    say: Exit 1 when the README block is missing or stale; a CI step for the package.
  - cmd: lean-pkg page my-proof --site docs --html docs/verification.html
    say: Also write the docs pages and one self-contained HTML file.
  - cmd: lean-pkg page my-proof --check --corroborate
    say: The same check with each GitHub Actions run corroborated against the public run API, so the GitHub Actions sentence (with its run links) is earned; for CI, with GITHUB_TOKEN set.

lean-pkg claims list:
  - cmd: lean-pkg claims list
    say: Print a table of every cached claim in the registry (id, kind, status, the package's trust level from the evidence the registry records, the pinned commit, the declaration).
    output: |
      ID                   KIND     STATUS    TRUST       PIN           DECL
      my-proof/main-bound  theorem  reusable  comparator  23d643ab1b53  MyProof.main_bound
      my-proof/aux-bound   lemma    internal  comparator  23d643ab1b53  MyProof.aux_bound
  - cmd: lean-pkg claims list my-proof
    say: One package's claims; with none cached it states the package's coverage (here a claims.yaml committed but not synced), names any legacy claims JSON in the checkout, and prints the next command.
    output: |
      my-proof: coverage: unsynced (cached_claims: 0, claims.yaml: present)
        legacy: legacy-claims.json (not read by lean-pkg; migrate it)
        next: claims.yaml is committed at HEAD but not synced: lean-pkg claims sync my-proof

lean-pkg claims migrate:
  - cmd: lean-pkg claims migrate my-proof --from legacy-claims.json
    say: Convert a legacy claims JSON (path relative to the checkout) into a claims/1 skeleton claims.yaml in the checkout, with TODO placeholders that `claims sync` refuses for an unmapped decl, file or summary (an unmapped kind or status gets a valid default, flagged in the comment header); it never overwrites a file, never writes the registry and grants no verification.
  - cmd: lean-pkg claims migrate my-proof --from legacy-claims.json --dry-run
    say: Print the skeleton, with its comment header listing the TODOs and the unmapped legacy keys, and write nothing.
  - cmd: lean-pkg claims migrate my-proof --from legacy-claims.json --out claims-migrated.yaml
    say: Write the skeleton to another repo-relative path (here because claims.yaml already exists); fix the TODOs, commit it, then run `claims sync`.
    output: |
      my-proof: 1 claim(s) from legacy-claims.json, 1 with TODO markers
      wrote claims-migrated.yaml (not committed, not synced; the registry is unchanged)
      next: edit claims-migrated.yaml: resolve the TODO markers; git add claims-migrated.yaml && git commit; lean-pkg claims sync my-proof

lean-pkg claims ledger:
  - cmd: lean-pkg claims ledger my-proof
    say: Re-check each claim against the recorded gate and comparator receipts (promote stage, the default) and print its status with named diagnostics; an internal theorem or lemma that a comparator configuration at the gate-bound commit names, with the comparator tier clean, is judged like a reusable one (verified when its diagnostics are empty) but never required, nothing is stored, and the exit is 0 only when the package is ready.
    output: |
      my-proof: claims ledger (promote stage): READY; 1 required, 2 verified
        claims from claims.yaml at 23d643ab1b53; gate-bound commit 23d643ab1b53
        verified     my-proof/main-bound (MyProof.main_bound)
        verified     my-proof/aux-bound (MyProof.aux_bound) [internal, judged by the comparator]
        ledger_digest: sha256:f092217e8c62f3dfbf6f528663d5b6a484c5c2075fb03230e5d989ef5e62adfd
      my-proof: claims ledger (promote stage): READY; 1 required, 2 verified
  - cmd: lean-pkg claims ledger my-proof --stage gate
    say: Require only the lower-tier receipt; an internal claim is judged only at the promote stage, so here it stays out-of-scope.
    output: |
      my-proof: claims ledger (gate stage): READY; 1 required, 1 verified, 1 out-of-scope
        claims from claims.yaml at 23d643ab1b53; gate-bound commit 23d643ab1b53
        verified     my-proof/main-bound (MyProof.main_bound)
        out-of-scope my-proof/aux-bound (MyProof.aux_bound) [internal]
        ledger_digest: sha256:512d404728b4332e3f2e27427c1f4482ba1256e2634520860a3244e1a69b1960
      my-proof: claims ledger (gate stage): READY; 1 required, 1 verified, 1 out-of-scope

lean-pkg claims mark:
  - cmd: lean-pkg claims mark my-proof --from-comparator comparator.json --status reusable
    say: Print which claims in the checkout's claims file the configuration's theorem_names cover and how their status would change; a dry run, nothing is written.
    output: |
      my-proof: 2 claim(s) covered by 2 theorem name(s) of comparator.json; 1 would change to status reusable
        kept my-proof/main-bound (MyProof.main_bound): reusable -> reusable
        set my-proof/aux-bound (MyProof.aux_bound): internal -> reusable
      DRY RUN — nothing written; --write edits claims.yaml in the checkout (never commits)
  - cmd: lean-pkg claims mark my-proof --from-comparator comparator.json --status reusable --write
    say: Edit only those status values in the working copy (comments and layout kept when an in-place edit is possible, else the file is re-dumped and says so) and validate the result; it never commits and never writes the registry, so commit, run `claims sync` and re-gate.

lean-pkg claims rebase:
  - cmd: lean-pkg claims rebase my-proof --from-tex old/paper.tex --to-tex new/paper.tex --to-aux new/paper.aux --from-aux old/paper.aux --to-version arXiv:2510.01234v2 --out-dir rebase-v2
    say: Compare each label the claims and coverage.yaml committed at HEAD refer to between the old and the new TeX, and write the proposed claims.yaml and coverage.yaml, the report and the review excerpts into the new or empty rebase-v2; it never edits the checkout or the registry and exits 1 when anything needs review.
  - cmd: lean-pkg claims rebase my-proof --from-tex old/paper.tex --to-tex new/paper.tex --to-aux new/paper.aux --from-sha256 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef --json
    say: The report only (no --out-dir, nothing written), stating the old TeX's SHA-256 because coverage.yaml records none; a mismatch is refused.

lean-pkg formalization render:
  - cmd: lean-pkg formalization render my-proof
    say: Print formalization.yaml (v0.4) rendered from the registry and the repository at HEAD to stdout, with a warning for each placeholder the registry cannot fill.
  - cmd: lean-pkg formalization render my-proof --write
    say: Write it into the checkout (a no-op when equal; a file differing only in derived keys, as after a re-gate, is refreshed and the paths are named; one whose kept keys differ is refused unless --force) and set the registry's formalization_yaml pointer when it is not already set (a registry write); the file is not committed.
  - cmd: lean-pkg formalization render my-proof --write --no-registry
    say: Write the file only and leave the registry untouched (no pointer, no event, no lock).

lean-pkg formalization anchor:
  - cmd: lean-pkg formalization anchor my-proof --arxiv 2510.01234v1 --from-file 2510.01234v1.tar.gz --compare-tex paper.tex
    say: Read the downloaded e-print in memory, hash it and its source files, find the main .tex and compare it with your paper.tex; a dry run, nothing is written and nothing is fetched.
  - cmd: lean-pkg formalization anchor my-proof --arxiv 2510.01234v1 --from-file 2510.01234v1.tar.gz --compare-tex paper.tex --write
    say: Also write the source-baseline record under data/source-baselines/, coverage.yaml's manuscript version and eprint_sha256, and the formalization.yaml source id, refused unless the e-print is tied to the manuscript coverage.yaml is bound to; never the registry, never a commit.
  - cmd: lean-pkg formalization anchor my-proof --arxiv 2510.01234v1 --fetch --compare-tex paper.tex
    say: Download that version's e-print over HTTPS instead (60 s timeout, 64 MiB cap) and that version's arXiv API entry (its submission timestamps), the only network access the command makes.

lean-pkg formalization kept:
  - cmd: lean-pkg formalization kept
    say: Print the kept view of formalization.yaml in the current directory (every key `formalization render` derives removed) as JSON and the SHA-256 of its canonical bytes; it reads no registry and writes nothing.
  - cmd: lean-pkg formalization kept --at HEAD --against HEAD~1
    say: Read the file committed at HEAD and list the kept keys that differ from HEAD~1; exit 1 when any does, so a derived-key refresh alone passes.
    output: |
      ...
      kept-view sha256 b52beedad1b9b64e5c551e4987a130471861913ece8ae0f7cd1e7e63dfbdb962  formalization.yaml at HEAD (055bf9995e82)
      changed kept key(s) since HEAD~1 (28fbec50ee3e): status.scope

# --- publish ----------------------------------------------------------------------------------------

lean-pkg publish:
  - cmd: lean-pkg publish my-proof
    say: The read-only checklist from verified-private to listed, with the exact next commands; exit 1 while not ready.
  - cmd: lean-pkg publish my-proof --public-safety
    say: The same, also scanning the tree and the git history for private strings.
  - cmd: lean-pkg publish my-proof --corroborate
    say: The same, with the page line rendered from corroborated GitHub Actions runs (page --check --corroborate).
  - cmd: lean-pkg publish my-proof --yes --dry-run
    say: The promotion checklist that --yes runs; nothing changes (the pre-1.0 `promote my-proof`).
  - cmd: lean-pkg publish my-proof --yes
    say: Make the GitHub repository public after the checklist passes again; this cannot be undone in practice.

lean-pkg public-safety:
  - cmd: lean-pkg public-safety my-proof
    say: Scan the tree and the history publishing would expose for private patterns; exit 1 on a blocking hit.

lean-pkg index add:
  - cmd: "lean-pkg index add my-proof --from-registry --by your-handle --headline 'MyProof.main_theorem :: MyProof/Main.lean :: One sentence saying what it proves.'"
    say: Write index/my-proof/entry.yaml from the registry row (repository, receipts, license, Palomar, DOI, Reservoir), cloning the package at the pin, validating and copying its receipts and computing the trust level; refused when consent is not recorded, the entry already exists or the pin is not on a public branch.
  - cmd: "lean-pkg index add my-proof --url https://github.com/you/my-proof --license Apache-2.0 --lower .lean-receipts/0123456789ab-slurm-4242.json --comparator .lean-receipts/0123456789ab-comparator.json --consent-recorded --by your-handle --headline 'MyProof.main_theorem :: MyProof/Main.lean :: One sentence.'"
    say: The same without a registry, with the repository, license and receipt paths passed as flags and every coauthor's consent asserted.
  - cmd: "lean-pkg index add my-proof --from-registry --replace --by your-handle --headline 'MyProof.main_theorem :: MyProof/Main.lean :: One sentence.'"
    say: Re-pin an existing entry at a new gated commit, replacing its receipt copies and carrying its built_on credits over unless --built-on-file is given.

lean-pkg index check:
  - cmd: lean-pkg index check
    say: Statically check every entry (schema, receipt copies, trust, duplicates), printing the verdict before and after the per-entry lines; exit 0 all pass, 1 any failure, 2 a usage error.
    output: |
      3 entries checked: all pass
      PASS gromov-filling-lean (comparator)
        note: static check only: pass --clone (or --repo) to re-derive from bytes
      PASS markovprocess-pilot (comparator)
        note: static check only: pass --clone (or --repo) to re-derive from bytes
      PASS total-coloring-lean (comparator)
        note: static check only: pass --clone (or --repo) to re-derive from bytes
      3 entries checked: all pass
  - cmd: lean-pkg index check --clone my-proof
    say: Clone the entry's repository at the pin into a temporary directory, re-derive its receipts, toolchain, license, tag and headline files from those bytes and recompute trust; Palomar and Reservoir are verified when reachable, else reported as skipped.
  - cmd: lean-pkg index check my-proof --repo ../my-proof
    say: The same re-derivation from a local clone of one package, which is never modified.

lean-pkg index render:
  - cmd: lean-pkg index render --index index
    say: Regenerate the Markdown table index/README.md from every index/*/entry.yaml, plus a claims list when index-entry/2 entries exist.
    output: |
      index rendered: index/README.md (3 entries)
  - cmd: lean-pkg index render --check --index index
    say: Write nothing and exit 1 when index/README.md is stale against the entries.
    output: |
      index/README.md: current

lean-pkg index migrate:
  - cmd: lean-pkg index migrate --check
    say: Write nothing and exit 1 when any entry is still index-entry/1.
    output: |
      gromov-filling-lean: already index-entry/2
      markovprocess-pilot: already index-entry/2
      total-coloring-lean: already index-entry/2
  - cmd: lean-pkg index migrate
    say: Rewrite every index-entry/1 entry as index-entry/2 by deriving its claims from its headline, changing no other key.

lean-pkg reservoir check:
  - cmd: lean-pkg reservoir check my-proof
    say: Check, read-only, Reservoir's listing criteria for the registered package (a public non-fork GitHub repository with at least 2 stars, tracked lake-manifest.json and lean-toolchain, a license matching the record, a lakefile with a package name that has not opted out; a non-release toolchain, no tag at HEAD or no listing yet only warns), then query Reservoir's package API; exit 0 when no criterion fails, else 1.
  - cmd: lean-pkg reservoir check my-proof --offline
    say: The same checklist without querying Reservoir's package API.

lean-pkg palomar prepare:
  - cmd: lean-pkg palomar prepare my-proof --dry-run
    say: Run every check a bundle needs (recorded consent, gate and comparator receipts bound to HEAD or an evidence-only ancestor, the formalization.yaml render, no `error` gap from `palomar check`, no blocking public-safety hit) and print the plan; nothing is written and nothing is submitted.
  - cmd: lean-pkg palomar prepare my-proof
    say: Write the Palomar submission bundle (formalization.yaml, configs/, receipts/, README.txt with the manual steps, MANIFEST.sha256) to <checkout>/.lean-receipts/palomar-<HEAD12>/ and record `palomar-prepared`; exit 1 with nothing written when a check fails.
  - cmd: lean-pkg palomar prepare my-proof --out ~/palomar-bundle --json
    say: The same into a directory that must not exist or be empty, with the result as JSON.

lean-pkg palomar check:
  - cmd: lean-pkg palomar check my-proof
    say: List every gap between the package at the gate-bound commit (else HEAD) and Palomar's pinned mechanical rules, read-only and offline from git objects; exit 1 when any gap is an `error`.
    output: |
      my-proof: Palomar check at 9f18d4268b03: NOT READY — 5 gap(s): 3 error, 2 warn [HEAD]
        ✗  formalization.missing: formalization.yaml is not tracked in the project
              formalization.yaml
              fix: render it (`lean-pkg formalization my-proof --write`), fill the placeholders, commit
        ✗  license.spdx_unset: license_spdx is not recorded in the registry
              fix: lean-pkg update my-proof --license-spdx ID
        ...
        WARN  commit.not_pushed: commit 9f18d4268b03 is in no remote-tracking branch (local refs; nothing fetched)
              fix: push it; Palomar pins a commit of the public repository
      rules: PalomarSubmission@d4e41c1d5b0d (committed 2026-10-05, read 2026-10-16); toolchain minimum v4.35.0-rc2; 3 .lean file(s), 0 without a module header
      ...
      my-proof: Palomar check at 9f18d4268b03: NOT READY — 5 gap(s): 3 error, 2 warn
  - cmd: lean-pkg palomar check my-proof --rev HEAD --config comparator.json --json
    say: Judge HEAD and only the named comparator configuration, with each gap as JSON {code, severity, paths, detail, fix}.

lean-pkg palomar port-modules:
  - cmd: lean-pkg palomar port-modules my-proof
    say: A dry run (the default) of the port to Lean's module system that Palomar requires; prints per file the edits (`module` header, `public import`, `public section` ... `end`), the review items and a unified diff, and writes nothing.
    output: |
      my-proof: port-modules at e571a8019193: 1 file(s) to port, 3 already module-headed, 0 refused, 0 review item(s) (dry run: nothing written)
        PORT  MyProof/Extra.lean
                - insert `module` as the first command
                - 1 import(s) -> public import
                - wrap the body in `public section` ... `end`
        (3 already module-headed file(s) skipped)
      ...
      next: lean-pkg palomar port-modules my-proof --write (a clean working tree; never commits)
      my-proof: port-modules at e571a8019193: 1 file(s) to port, 3 already module-headed, 0 refused, 0 review item(s) (dry run: nothing written)
  - cmd: lean-pkg palomar port-modules my-proof --write
    say: Apply the plan to a clean working tree (a dirty tree, a refused file or a foreign lease exits 1 with nothing written); it never commits and never writes the registry.

# --- other programs ---------------------------------------------------------------------------------

lean-exercise check:
  - cmd: lean-exercise check --challenge Challenge.lean --solution Solution.lean
    say: Judge each sorry'd theorem of the Challenge against the Solution with `lake comparator`, sandboxed; no registry.

lean-exercise batch:
  - cmd: lean-exercise batch --challenge Challenge.lean --solutions submissions/ --csv grades.csv --logs logs/
    say: Judge every *.lean file directly in submissions/ as `check` would, sandboxed and each in its own fresh project, writing one CSV row and one <stem>.log per file; exit 1 when any file fails or is refused.
  - cmd: lean-exercise batch --challenge Midterm.lean --solutions submissions/ --csv grades.csv --logs logs/ --project ~/course-mathlib --forbid MeasurableSpace.DynkinSystem. --forbid-exact MeasurableSpace.induction_on_inter
    say: The same against a prebuilt Mathlib project (bound read-only, nothing downloaded), rejecting a proof that depends on the forbidden constants.

lean-pkg-extract plan:
  - cmd: lean-pkg-extract plan --repo . --commit HEAD --manifest extract.json
    say: Classify every file under the manifest's roots at the commit (default deny), check pins, modules, claims and imports from git objects only, and print the inventory; writes nothing, exit 1 with every refusal listed.
    output: |
      plan: REFUSED (1 refusal(s)): 16 file(s) included (25095 bytes), 0 excluded, 0 allowed private, 4 module(s), 0 claim(s), 0 weakening(s); source commit d3cb7c86cccc608017c2dc944db57931d6007409
      refusals:
        - verify.sh: unclassified in a lean-package root (default deny); exclude it, move it, or put it in a root whose kind carries it
      included (to <- from, size, sha256, blob, mode, class):
        ...
      modules (module -> file, library):
        MyProof.Axioms -> MyProof/Axioms.lean  (MyProof)
        ...
      plan: REFUSED (1 refusal(s)): 16 file(s) included (25095 bytes), 0 excluded, 0 allowed private, 4 module(s), 0 claim(s), 0 weakening(s); source commit d3cb7c86cccc608017c2dc944db57931d6007409
  - cmd: lean-pkg-extract plan --repo . --commit v1.0 --manifest extract.json --report ../extract-plan.json
    say: The same at a tag, also writing the JSON plan (with the private excluded list) to a path outside the source repository, its one write.
