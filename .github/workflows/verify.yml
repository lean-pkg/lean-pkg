# lean-pkg's reusable verify workflow (proposal 0008, stage S2): a PACKAGE repository calls it, pinned to a
# full 40-hex commit of lean-pkg (`lean-pkg receipt ci --template` prints the caller). It never runs on
# lean-pkg's own pushes: its only trigger is workflow_call.
#
# The job checks out the pushed commit, installs elan (a pinned release, its archive hash checked), the
# Mathlib cache when the package depends on Mathlib, and lean-pkg at the commit of this very file
# (github.job_workflow_sha), runs the package's verify command with its log sealed in-log, then
# `lean-pkg receipt ci`, and uploads the receipt and its redacted log as the artifact
# lean-pkg-receipt-<run_id>-<run_attempt>. The author collects it with `lean-pkg receipt ci --collect RUN`
# and commits it; CI never pushes to the package's repository (no contents: write).
#
# Every action is pinned to a full commit SHA. Inputs reach shell steps through env, never interpolated into
# a script.
name: lean-pkg verify (reusable)

on:
  workflow_call:
    inputs:
      verify-command:
        description: the package's verify command; run from package-dir with the log path appended as its last argument
        type: string
        default: bash verify.sh
      package-dir:
        description: the package directory, relative to the repository root
        type: string
        default: .
      checker:
        description: the checker text for the receipt when the log has no checker line
        type: string
        default: ""
      timeout-minutes:
        description: the job's time limit (a GitHub-hosted runner allows at most 360)
        type: number
        default: 360

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    # GitHub-hosted only: `receipt ci` refuses a self-hosted runner
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write   # the OIDC token's job_workflow_ref claim becomes ci.job_workflow; the token is never kept
    env:
      PKG_DIR: ${{ inputs.package-dir }}
      LEAN_PKG_SHA: ${{ github.job_workflow_sha }}
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Fetch the workflow commit when it is not the pushed one
        run: |
          git cat-file -e "${GITHUB_WORKFLOW_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "$GITHUB_WORKFLOW_SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install lean-pkg at this workflow's commit
        run: |
          [[ "$LEAN_PKG_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "github.job_workflow_sha is not a 40-hex commit: '$LEAN_PKG_SHA'" >&2; exit 1; }
          python -m pip install --disable-pip-version-check "git+https://github.com/lean-pkg/lean-pkg.git@${LEAN_PKG_SHA}"
          lean-pkg --version

      - name: Install elan (pinned release)
        run: |
          d=$(mktemp -d)
          curl -sSfL "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" -o "$d/elan.tar.gz"
          echo "${ELAN_SHA256}  $d/elan.tar.gz" | sha256sum -c -
          tar -xzf "$d/elan.tar.gz" -C "$d"
          "$d/elan-init" -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Mathlib cache
        working-directory: ${{ inputs.package-dir }}
        run: |
          if [ -f lake-manifest.json ] && grep -q '"name": *"mathlib"' lake-manifest.json; then
            lake exe cache get
          else
            echo "no Mathlib dependency: no cache to fetch"
          fi

      - name: Verify (log sealed in-log)
        working-directory: ${{ inputs.package-dir }}
        env:
          VERIFY_COMMAND: ${{ inputs.verify-command }}
        run: |
          mkdir -p "$RUNNER_TEMP/lean-pkg"
          LOG="$RUNNER_TEMP/lean-pkg/verify.log"
          bash -c "$VERIFY_COMMAND \"\$1\"" verify "$LOG"
          # the in-log seal `receipt ci` checks: the SHA-256 of the log without this line, nothing written after it
          printf 'verify-log-sha256: %s\n' "$(sha256sum "$LOG" | cut -d' ' -f1)" >> "$LOG"

      - name: Write the receipt (lean-pkg receipt ci)
        env:
          CHECKER: ${{ inputs.checker }}
        run: |
          set -- --log "$RUNNER_TEMP/lean-pkg/verify.log" --repo "$PKG_DIR"
          if [ -n "$CHECKER" ]; then set -- "$@" --checker "$CHECKER"; fi
          lean-pkg receipt ci "$@"

      - name: Upload the receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-pkg-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ inputs.package-dir }}/.lean-receipts/*-gha-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ inputs.package-dir }}/.lean-receipts/*-gha-${{ github.run_id }}-${{ github.run_attempt }}-verify.redacted.log
          if-no-files-found: error
