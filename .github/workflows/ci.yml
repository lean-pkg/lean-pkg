name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Console scripts start
        run: |
          lean-pkg --help >/dev/null
          comparator-receipt --help >/dev/null
      # In parallel (pytest-xdist from the test extra): about 5x faster than serial on 16 cores.
      - name: Test
        run: python -m pytest -q -n auto
      - name: Generated files are current
        run: |
          make docs
          git diff --exit-code || { echo "generated files are stale: run \`make docs\` and commit the result" >&2; exit 1; }

  private-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history scan needs every commit, the PR's own included
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forbidden-string scan
        run: bash scripts/private-boundary-check.sh
      # Commit messages and old blobs escape the tree scan: #94's squash message named a private
      # host, passed CI, and needed a history rewrite of main before 0.7.31 could be released.
      - name: Forbidden-string scan, history and commit messages
        run: bash scripts/private-boundary-check.sh --history
      # fetch-depth: 0 above also fetches every tag; --require-tags fails if they are missing.
      - name: Released CHANGELOG sections match their tags
        run: python3 scripts/check-changelog-releases.py --require-tags
      # `## [Unreleased]` agrees with the in-progress upgrade record: no no_author_change PR's entry under
      # ### Added, every record heading present (RELEASING.md "When to tag"). Needs the history and tags above.
      - name: Unreleased CHANGELOG headings agree with the upgrade record
        run: |
          python -m pip install -q pyyaml
          python scripts/release-version.py --check
      # Every pull request since the last release, and this one (its squash commit does not exist yet), is
      # named by the in-progress record; doctor --upgrade-from only listed the gap at release time (#285).
      - name: The upgrade record names every pull request
        env:
          PR: ${{ github.event.pull_request.number }}
        run: python scripts/release-version.py --curated ${PR:+--pr "$PR"}
      # ShellCheck on lean-pkg's own shell scripts (the file list is `make shellcheck`'s; the vendored
      # comparator-check.sh is left as upstream wrote it). Pinned: shellcheck-py ships the binary, so a new
      # ShellCheck release cannot fail an unrelated pull request.
      - name: ShellCheck
        run: |
          python -m pip install -q shellcheck-py==0.11.0.1
          shellcheck --version | sed -n 2p
          make shellcheck
      - name: No tab characters
        run: |
          if grep -rnP '\t' --include='*.py' --include='*.sh' --include='*.md' \
               --include='*.toml' --include='*.yml' --include='*.txt' \
               --exclude-dir=.git .; then
            echo "tab characters found" >&2
            exit 1
          fi
