name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Console scripts start
        run: |
          lean-pkg --help >/dev/null
          comparator-receipt --help >/dev/null
      - name: Test
        run: python -m pytest -q
      - name: Generated files are current
        run: |
          make docs
          git diff --exit-code || { echo "generated files are stale: run \`make docs\` and commit the result" >&2; exit 1; }

  private-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history scan needs every commit, the PR's own included
      - name: Forbidden-string scan
        run: bash scripts/private-boundary-check.sh
      # Commit messages and old blobs escape the tree scan: #94's squash message named a private
      # host, passed CI, and needed a history rewrite of main before 0.7.31 could be released.
      - name: Forbidden-string scan, history and commit messages
        run: bash scripts/private-boundary-check.sh --history
      - name: No tab characters
        run: |
          if grep -rnP '\t' --include='*.py' --include='*.sh' --include='*.md' \
               --include='*.toml' --include='*.yml' --include='*.txt' \
               --exclude-dir=.git .; then
            echo "tab characters found" >&2
            exit 1
          fi
