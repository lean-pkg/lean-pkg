name: Publish to PyPI

# Run by hand only (Actions > Publish to PyPI > Run workflow): an upload to PyPI cannot be undone (a version
# number is spent even when its files are deleted), so no push or tag publishes. Trusted Publishing: PyPI
# accepts this workflow's OIDC token for the environment named below; no API token is stored anywhere.
# One-time setup on pypi.org and test.pypi.org: RELEASING.md, "Publish to PyPI".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish (vX.Y.Z, already cut by make cut-release)"
        required: true
      index:
        description: "where to upload: testpypi first, then pypi"
        required: true
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag and version agree
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("source/pyproject.toml", "rb"))["project"]["version"])')
          [ "$TAG" = "v$version" ] || { echo "tag $TAG is not v$version (pyproject.toml)" >&2; exit 1; }
      # The sdist from the tag, then the wheel from the unpacked sdist only: a file missing from the sdist
      # fails the wheel build here instead of reaching users (the frontend runs outside the source tree).
      - name: Build the sdist, then the wheel from it
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --sdist --outdir dist source
          set -- dist/*.tar.gz; [ "$#" = 1 ] || { echo "expected one sdist" >&2; exit 1; }
          mkdir unpacked && tar -xzf "$1" -C unpacked
          set -- unpacked/*/; [ "$#" = 1 ] || { echo "expected one sdist root" >&2; exit 1; }
          python -m build --wheel --outdir dist "$1"
          python -m twine check --strict dist/*
          sha256sum dist/*
      - name: The wheel installs and runs outside the source tree
        run: |
          python -m venv /tmp/smoke && /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp && /tmp/smoke/bin/lean-pkg --version && /tmp/smoke/bin/pip check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/p/lean-pkg' || 'https://test.pypi.org/p/lean-pkg' }}
    permissions:
      id-token: write   # Trusted Publishing; only this job, only this step's action uses it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
