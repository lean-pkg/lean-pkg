[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-pkg"
version = "0.25.0"
description = "Lifecycle registry and trust gate for Lean 4 formalization packages: leases, receipt-bound gates, comparator (Palomar) evidence, one-way promotion."
# PyPI renders the long description without the repository around it, so README.md's relative links and
# images would break there: PYPI.md is a short page whose links are all absolute (tests/test_packaging.py).
readme = "PYPI.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Le Chen" }]
dependencies = ["pyyaml>=6"]
keywords = ["lean", "lean4", "formal verification", "theorem proving", "mathlib", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/lean-pkg/lean-pkg"
Documentation = "https://lean-pkg.github.io/lean-pkg/"
Source = "https://github.com/lean-pkg/lean-pkg"
Changelog = "https://github.com/lean-pkg/lean-pkg/blob/main/CHANGELOG.md"
Issues = "https://github.com/lean-pkg/lean-pkg/issues"
DOI = "https://doi.org/10.5281/zenodo.23272098"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3", "pytest-timeout>=2", "jsonschema>=4", "setuptools>=77"]

[project.scripts]
lean-pkg = "lean_pkg.cli:main"
comparator-receipt = "lean_pkg.comparator_receipt:main"
lean-exercise = "lean_pkg.exercise:main"
lean-pkg-extract = "lean_pkg.extract:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lean_pkg = ["scripts/*.sh", "scripts/*.lean", "schemas/*.json", "schemas/*.txt", "site_profiles/*.yaml", "templates/*.txt", "data/*.yaml", "data/stacks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# pytest-timeout: a hung subprocess fails its test instead of holding the runner. The slowest test takes
# about 45 s; 300 s leaves room for a loaded runner under xdist. A test that runs the real Lean toolchain
# carries its own @pytest.mark.timeout, sized to the limits of the builds and judges it runs.
timeout = 300

# `make lint` (and CI, pinned): ruff check on src/, scripts/ and tests/, which hold every Python file in the
# repository. Pyflakes (F), syntax errors (E9) and bugbear (B) to start (#314); no formatter, no style rules.
[tool.ruff]
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
# F811: the tests import shared pytest fixtures (`from tests.x import repo, fake_sacct`) and pytest injects
# them by naming them as test parameters, which pyflakes reads as redefining the unused import. Every one of
# the 239 findings of the first pass was this pattern (a parameter, a lambda parameter or a local rebinding of
# a fixture name), none a duplicated test function.
"tests/**" = ["F811"]
