[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-pkg"
version = "0.19.0"
description = "Lifecycle registry and trust gate for Lean 4 formalization packages: leases, receipt-bound gates, comparator (Palomar) evidence, one-way promotion."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Le Chen" }]
dependencies = ["pyyaml>=6"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
lean-pkg = "lean_pkg.cli:main"
comparator-receipt = "lean_pkg.comparator_receipt:main"
lean-exercise = "lean_pkg.exercise:main"
lean-pkg-extract = "lean_pkg.extract:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lean_pkg = ["scripts/*.sh", "scripts/*.lean", "schemas/*.json", "schemas/*.txt", "site_profiles/*.yaml", "templates/*.txt", "data/*.yaml", "data/stacks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
